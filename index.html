                  </div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <input placeholder="Giá đóng lệnh" type="number" value={exitInputs[t.id] || ""} onChange={(e) => setExitInputs({ ...exitInputs, [t.id]: e.target.value })} style={{ width: 110, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "5px 8px", color: C.text, fontSize: 12, fontFamily: "'JetBrains Mono', monospace" }} />
                    {li.curPrice != null && (
                      <button className="tt-btn" onClick={() => setExitInputs({ ...exitInputs, [t.id]: li.curPrice })} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "5px 8px", color: C.textDim, fontSize: 11 }}>Dùng giá hiện tại</button>
                    )}
                    <button className="tt-btn" onClick={() => exitInputs[t.id] && closeTrade(t.id, +exitInputs[t.id])} style={{ background: C.blue, border: "none", borderRadius: 6, padding: "6px 10px", color: "#04101a", fontSize: 12, fontWeight: 600 }}>Đóng lệnh</button>
                    <button className="tt-btn" onClick={() => deleteTrade(t.id)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px" }}><Icon name="trash" size={13} color={C.textFaint} /></button>
                  </div>
                </div>
                {warnTone === "bear" && (
                  <div style={{ marginTop: 8, fontSize: 12.5, color: C.bear, display: "flex", gap: 6, alignItems: "center" }}><Icon name="alert" size={13} /> Giá hiện tại đã chạm/vượt mức cắt lỗ đã đặt ra ban đầu — tool không tự động bán, cần bạn tự thao tác trên sàn nếu muốn tuân thủ đúng kế hoạch.</div>
                )}
                {warnTone === "amber" && (
                  <div style={{ marginTop: 8, fontSize: 12.5, color: C.amber, display: "flex", gap: 6, alignItems: "center" }}><Icon name="alert" size={13} /> Đã giữ quá {MAX_HOLD_DAYS} ngày (vượt mức thiết kế ban đầu) và đang lỗ — đây là dấu hiệu nên xem lại kỷ luật thay vì tiếp tục chờ.</div>
                )}
              </div>
            );
          })}
        </div>
      </Card>

      {closedTrades.length > 0 && (
        <Card>
          <SectionLabel>Hệ thống đề xuất vs Tự quyết định — bạn override có đúng không?</SectionLabel>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px,1fr))", gap: 14, marginBottom: manualStats ? 16 : 0 }}>
            <div style={{ background: C.surface2, borderRadius: 10, padding: 14 }}>
              <div style={{ fontSize: 12, color: C.blue, fontFamily: "'JetBrains Mono', monospace", marginBottom: 8 }}>HỆ THỐNG ĐỀ XUẤT (LONG)</div>
              {systemStats ? (
                <div style={{ display: "flex", gap: 20, flexWrap: "wrap", fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }}>
                  <div>{systemStats.count} lệnh</div>
                  <div>Win rate <b>{systemStats.winRate.toFixed(0)}%</b></div>
                  <div style={{ color: systemStats.avgPct >= 0 ? C.bull : C.bear }}>TB {systemStats.avgPct >= 0 ? "+" : ""}{systemStats.avgPct.toFixed(2)}%/lệnh</div>
                </div>
              ) : <div style={{ color: C.textFaint, fontSize: 13 }}>Chưa có lệnh nào đóng.</div>}
            </div>
            <div style={{ background: C.amberDim, borderRadius: 10, padding: 14 }}>
              <div style={{ fontSize: 12, color: C.amber, fontFamily: "'JetBrains Mono', monospace", marginBottom: 8 }}>BẠN TỰ QUYẾT ĐỊNH (OVERRIDE)</div>
              {manualStats ? (
                <div style={{ display: "flex", gap: 20, flexWrap: "wrap", fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }}>
                  <div>{manualStats.count} lệnh</div>
                  <div>Win rate <b>{manualStats.winRate.toFixed(0)}%</b></div>
                  <div style={{ color: manualStats.avgPct >= 0 ? C.bull : C.bear }}>TB {manualStats.avgPct >= 0 ? "+" : ""}{manualStats.avgPct.toFixed(2)}%/lệnh</div>
                </div>
              ) : <div style={{ color: C.textFaint, fontSize: 13 }}>Chưa có lệnh tự quyết định nào đóng.</div>}
            </div>
          </div>
          {systemStats && manualStats && (
            <div style={{ fontSize: 12.5, color: C.textDim, marginBottom: 16 }}>
              {manualStats.avgPct > systemStats.avgPct
                ? "Cho đến nay, các lệnh bạn tự quyết định đang cho kết quả TỐT HƠN lệnh hệ thống đề xuất — nhưng cần nhiều lệnh hơn để chắc chắn đây không phải may mắn ngẫu nhiên."
                : "Cho đến nay, các lệnh bạn tự quyết định đang cho kết quả KÉM HƠN lệnh hệ thống đề xuất — đáng để xem lại lý do override trước khi tiếp tục lặp lại."}
            </div>
          )}
          {Object.keys(manualBySignal).length > 0 && (
            <div style={{ overflowX: "auto" }}>
              <div style={{ fontSize: 11, color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase", marginBottom: 8 }}>Chi tiết theo tín hiệu lúc bạn vào lệnh</div>
              <table>
                <thead><tr style={{ color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, textTransform: "uppercase" }}>
                  <td style={{ padding: "6px 8px" }}>Tín hiệu lúc vào</td><td style={{ padding: "6px 8px" }}>Số lệnh</td><td style={{ padding: "6px 8px" }}>Win rate</td><td style={{ padding: "6px 8px" }}>TB %/lệnh</td>
                </tr></thead>
                <tbody>
                  {Object.entries(manualBySignal).map(([signal, list]) => {
                    const st = groupStats(list);
                    return (
                      <tr key={signal} style={{ borderTop: `1px solid ${C.border}` }}>
                        <td style={{ padding: "8px" }}>{signal}</td>
                        <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{st.count}</td>
                        <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{st.winRate.toFixed(0)}%</td>
                        <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace", color: st.avgPct >= 0 ? C.bull : C.bear }}>{st.avgPct >= 0 ? "+" : ""}{st.avgPct.toFixed(2)}%</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      )}

      {holdAccuracy && (
        <Card>
          <SectionLabel>Độ chính xác dự báo thời gian giữ lệnh (dựa trên {holdAccuracy.count} lệnh đã đóng)</SectionLabel>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", fontFamily: "'JetBrains Mono', monospace", fontSize: 14, marginBottom: 10 }}>
            <div>Tỷ lệ thực tế/dự kiến trung bình: <b style={{ color: holdAccuracy.avgRatio > 1.3 ? C.amber : holdAccuracy.avgRatio < 0.7 ? C.blue : C.bull }}>{holdAccuracy.avgRatio.toFixed(2)}x</b></div>
            <div>Giữ lâu hơn dự kiến: <b>{holdAccuracy.overCount}</b> lệnh</div>
            <div>Giữ nhanh hơn dự kiến: <b>{holdAccuracy.underCount}</b> lệnh</div>
          </div>
          <div style={{ fontSize: 12.5, color: C.textDim, lineHeight: 1.6 }}>
            {holdAccuracy.avgRatio > 1.3
              ? `Trung bình bạn đang giữ lệnh lâu hơn ~${holdAccuracy.avgRatio.toFixed(1)}x so với ước tính ATR — ước tính hiện tại có thể đang lạc quan (target xa hơn tốc độ biến động thực tế), hoặc thị trường gần đây đi ngang nhiều hơn quá khứ dùng để tính ATR.`
              : holdAccuracy.avgRatio < 0.7
              ? `Trung bình lệnh chạm target nhanh hơn nhiều so với ước tính — ước tính hiện tại có thể đang thận trọng quá mức, hoặc thị trường gần đây biến động mạnh hơn quá khứ dùng để tính ATR.`
              : `Ước tính thời gian giữ lệnh hiện đang khá sát với thực tế (trong khoảng 0.7x-1.3x) — dấu hiệu tốt về độ tin cậy của công thức.`}
            {holdAccuracy.count < 10 && " Lưu ý: mẫu còn nhỏ, cần thêm lệnh đóng để kết luận chắc chắn hơn."}
          </div>
        </Card>
      )}

      <Card><SectionLabel>Lịch sử lệnh đã đóng ({closedTrades.length})</SectionLabel>
        {closedTrades.length === 0 && <div style={{ color: C.textFaint, fontSize: 13 }}>Chưa có lệnh nào đóng.</div>}
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr style={{ color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, textTransform: "uppercase" }}><td style={{ padding: "6px 8px" }}>Coin</td><td style={{ padding: "6px 8px" }}>Nguồn</td><td style={{ padding: "6px 8px" }}>Vốn vào lệnh</td><td style={{ padding: "6px 8px" }}>Giá vào</td><td style={{ padding: "6px 8px" }}>Giá đóng</td><td style={{ padding: "6px 8px" }}>Giữ thực tế / Dự kiến</td><td style={{ padding: "6px 8px" }}>Qty</td><td style={{ padding: "6px 8px" }}>P&L</td><td style={{ padding: "6px 8px" }}>Mục tiêu</td></tr></thead>
            <tbody>{closedTrades.map((t) => {
              const overPlan = t.actualHoldMinutes != null && t.estHoldMinutes != null && t.actualHoldMinutes > t.estHoldMinutes;
              return (
              <tr key={t.id} style={{ borderTop: `1px solid ${C.border}` }}>
                <td style={{ padding: "8px" }}>{t.symbol}</td>
                <td style={{ padding: "8px" }}><Pill tone={t.source === "manual" ? "amber" : "blue"}>{t.source === "manual" ? "Tự quyết định" : "Hệ thống"}</Pill></td>
                <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{usd(t.entry * t.qty)}</td>
                <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{usd(t.entry)}</td><td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{usd(t.exitPrice)}</td>
                <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace", fontSize: 12 }}>
                  <span style={{ color: overPlan ? C.amber : C.text }}>{formatDuration(t.actualHoldMinutes)}</span>
                  <span style={{ color: C.textFaint }}> / {formatDuration(t.estHoldMinutes)}</span>
                </td>
                <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{fmt(t.qty, 5)}</td><td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace", color: t.pnl >= 0 ? C.bull : C.bear }}>{t.pnl >= 0 ? "+" : ""}{usd(t.pnl)}</td>
                <td style={{ padding: "8px" }}>
                  {t.pouredToGoal ? (
                    <Pill tone="bull">Đã rót</Pill>
                  ) : (
                    <button className="tt-btn" onClick={() => pourTradeToGoal(t)} style={{ background: "transparent", border: `1px solid ${C.amber}`, borderRadius: 6, color: C.amber, fontSize: 11.5, padding: "4px 8px" }}>Rót vào Mục tiêu</button>
                  )}
                </td>
              </tr>
            );})}</tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function BacktestTab({ btSymbol, setBtSymbol, btMonths, setBtMonths, btRunning, btError, btResult, runSingleBacktest, runWatchlistBacktest, currentEquity }) {
  const [targetCapital, setTargetCapital] = useState(5_000_000_000);
  const [startCapital, setStartCapital] = useState(currentEquity || 100_000_000);
  const [winRatePct, setWinRatePct] = useState(50);
  const [riskPct2, setRiskPct2] = useState(2);
  const [rr, setRr] = useState(2);
  const [source, setSource] = useState("manual"); // 'manual' | 'backtest'

  const s = btResult?.summary;

  function applyBacktestToProjection() {
    if (!s) return;
    setWinRatePct(+(s.winRate * 100).toFixed(1));
    if (s.avgR) setRr(+s.avgR.toFixed(2));
    setRiskPct2(+(Math.abs(s.avgLoss)).toFixed(2) || 2);
    setSource("backtest");
  }

  const manualGrowth = growthFromWinRateRR(winRatePct / 100, riskPct2 / 100, rr);
  const empiricalGrowth = s ? s.growthPerTrade : null;
  const growth = source === "backtest" && empiricalGrowth != null ? empiricalGrowth : manualGrowth;

  const nTrades = tradesNeeded(startCapital, targetCapital, growth);
  const freqs = [4, 8, 12, 20];
  const observedFreq = s && btResult?.spanMonths ? s.total / btResult.spanMonths : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Card>
        <SectionLabel>Backtest — kiểm chứng tín hiệu trên dữ liệu lịch sử thật</SectionLabel>
        <div style={{ fontSize: 13, color: C.textDim, marginBottom: 14, lineHeight: 1.6 }}>
          Chạy lại đúng công thức tín hiệu ở tab "Kế hoạch hành động" trên nến quá khứ (khung 4h), tại mỗi thời điểm chỉ dùng dữ liệu đã biết đến lúc đó — không nhìn trước tương lai. Mỗi lệnh mô phỏng đến khi chạm cắt lỗ/chốt lời hoặc hết tối đa 30 nến (~5 ngày) giữ lệnh.
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <input value={btSymbol} onChange={(e) => setBtSymbol(e.target.value)} placeholder="VD: BTC"
            style={{ width: 120, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 12px", color: C.text, fontSize: 14 }} />
          <select value={btMonths} onChange={(e) => setBtMonths(+e.target.value)}
            style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 10px", color: C.text, fontSize: 13 }}>
            <option value={3}>3 tháng gần nhất</option>
            <option value={6}>6 tháng gần nhất</option>
            <option value={12}>12 tháng gần nhất</option>
          </select>
          <button className="tt-btn" onClick={() => btSymbol.trim() && runSingleBacktest(btSymbol)} style={{ background: C.blue, border: "none", borderRadius: 8, padding: "9px 16px", color: "#04101a", fontWeight: 600, fontSize: 13 }}>
            {btRunning ? "Đang chạy..." : "Backtest 1 coin"}
          </button>
          <button className="tt-btn" onClick={runWatchlistBacktest} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 16px", color: C.text, fontWeight: 600, fontSize: 13 }}>
            {btRunning ? "Đang chạy..." : "Backtest cả danh sách theo dõi"}
          </button>
        </div>
        {btError && <div style={{ marginTop: 10, fontSize: 13, color: C.bear }}>{btError}</div>}
        {btRunning && <div style={{ marginTop: 10, fontSize: 13, color: C.textFaint }}>Đang tải dữ liệu lịch sử và mô phỏng từng nến — có thể mất 10-40 giây tùy số tháng/số coin.</div>}
      </Card>

      {s && (
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <SectionLabel>Kết quả backtest {btResult.mode === "single" ? `— ${btResult.symbol.replace("USDT", "")}` : "— toàn bộ danh sách theo dõi (gộp)"}</SectionLabel>
            <Pill tone={s.winRate >= 0.5 ? "bull" : "bear"}>{s.total} lệnh · {btMonths} tháng dữ liệu</Pill>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px,1fr))", gap: 12, marginTop: 8 }}>
            <MetricBox label="Tỷ lệ thắng đo được" value={(s.winRate * 100).toFixed(1) + "%"} icon={<Icon name="target" size={14} color={C.blue} />} tone={s.winRate >= 0.5 ? "bull" : "bear"} />
            <MetricBox label="Lãi TB / lệnh thắng" value={"+" + s.avgWin.toFixed(2) + "%"} icon={<Icon name="up" size={14} color={C.bull} />} tone="bull" />
            <MetricBox label="Lỗ TB / lệnh thua" value={s.avgLoss.toFixed(2) + "%"} icon={<Icon name="down" size={14} color={C.bear} />} tone="bear" />
            <MetricBox label="R:R đo được" value={s.avgR ? `1 : ${s.avgR.toFixed(2)}` : "—"} icon={<Icon name="activity" size={14} color={C.amber} />} />
            <MetricBox label="Profit Factor" value={s.profitFactor ? s.profitFactor.toFixed(2) : "—"} icon={<Icon name="activity" size={14} color={C.amber} />} />
            <MetricBox label="Tăng trưởng/lệnh (hình học)" value={(s.growthPerTrade * 100).toFixed(2) + "%"} icon={<Icon name="activity" size={14} color={C.blue} />} tone={s.growthPerTrade > 0 ? "bull" : "bear"} />
            <MetricBox label="Thời gian giữ lệnh TB" value={(s.avgBarsHeld * 4).toFixed(0) + " giờ"} icon={<Icon name="info" size={14} color={C.textDim} />} />
            <MetricBox label="Tần suất tín hiệu" value={(s.total / (btResult.spanMonths || btMonths)).toFixed(1) + " lệnh/tháng"} icon={<Icon name="info" size={14} color={C.textDim} />} />
          </div>
          {s.growthPerTrade <= 0 && (
            <div style={{ marginTop: 14, background: C.bearDim, borderRadius: 8, padding: "10px 14px", fontSize: 13, color: C.bear, display: "flex", gap: 8, alignItems: "center" }}>
              <Icon name="alert" size={15} /> Tăng trưởng/lệnh ≤ 0 trong giai đoạn backtest — bộ tín hiệu này KHÔNG có lợi thế thống kê dương trên dữ liệu đã kiểm tra. Không nên dùng để giao dịch thật ở dạng hiện tại.
            </div>
          )}
          <button className="tt-btn" onClick={applyBacktestToProjection} style={{ marginTop: 14, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 16px", color: C.blue, fontWeight: 600, fontSize: 13 }}>
            Dùng kết quả này cho bảng dự phóng bên dưới →
          </button>

          {btResult.mode === "watchlist" && (
            <div style={{ marginTop: 16, overflowX: "auto" }}>
              <table>
                <thead><tr style={{ color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, textTransform: "uppercase" }}>
                  <td style={{ padding: "6px 8px" }}>Coin</td><td style={{ padding: "6px 8px" }}>Số lệnh</td><td style={{ padding: "6px 8px" }}>Win rate</td><td style={{ padding: "6px 8px" }}>Tăng trưởng/lệnh</td>
                </tr></thead>
                <tbody>
                  {btResult.perSymbol.map((p) => (
                    <tr key={p.symbol} style={{ borderTop: `1px solid ${C.border}` }}>
                      <td style={{ padding: "8px" }}>{p.symbol.replace("USDT", "")}</td>
                      <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{p.summary ? p.summary.total : "—"}</td>
                      <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{p.summary ? (p.summary.winRate * 100).toFixed(0) + "%" : p.error ? "lỗi" : "—"}</td>
                      <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace", color: p.summary && p.summary.growthPerTrade > 0 ? C.bull : C.bear }}>{p.summary ? (p.summary.growthPerTrade * 100).toFixed(2) + "%" : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      )}

      <Card>
        <SectionLabel>Dự phóng lãi kép — tự tính theo win rate / R:R</SectionLabel>
        <div style={{ fontSize: 13, color: C.textDim, marginBottom: 14 }}>
          {source === "backtest" && s ? "Đang dùng số liệu đo được từ backtest ở trên." : "Đang dùng số liệu bạn tự nhập (mặc định win rate 50%, R:R 1:2) — chỉnh sliders hoặc bấm nút backtest ở trên để thay bằng số liệu thật."}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 12, marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Vốn bắt đầu</div>
            <input type="number" value={startCapital} onChange={(e) => { setStartCapital(+e.target.value); setSource("manual"); }} style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Mục tiêu vốn</div>
            <input type="number" value={targetCapital} onChange={(e) => setTargetCapital(+e.target.value)} style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Tỷ lệ thắng (%)</div>
            <input type="number" value={winRatePct} onChange={(e) => { setWinRatePct(+e.target.value); setSource("manual"); }} style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Rủi ro/lệnh thua (%)</div>
            <input type="number" value={riskPct2} onChange={(e) => { setRiskPct2(+e.target.value); setSource("manual"); }} style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>R:R (lãi/lỗ)</div>
            <input type="number" value={rr} onChange={(e) => { setRr(+e.target.value); setSource("manual"); }} style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
          </div>
        </div>

        <div style={{ background: C.surface2, borderRadius: 10, padding: 14, marginBottom: 14 }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, display: "flex", gap: 24, flexWrap: "wrap" }}>
            <div>Tăng trưởng kỳ vọng/lệnh: <b style={{ color: growth > 0 ? C.bull : C.bear }}>{(growth * 100).toFixed(2)}%</b></div>
            <div>Số lệnh cần: <b>{nTrades ?? "—"}</b></div>
          </div>
          {growth <= 0 && <div style={{ marginTop: 8, fontSize: 13, color: C.bear }}>Với thông số này, vốn không tăng trưởng theo thời gian (hòa hoặc âm) — không thể đạt mục tiêu dù giao dịch bao lâu.</div>}
        </div>

        {nTrades && (
          <div style={{ overflowX: "auto" }}>
            <table>
              <thead><tr style={{ color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, textTransform: "uppercase" }}>
                <td style={{ padding: "6px 8px" }}>Tần suất</td><td style={{ padding: "6px 8px" }}>Thời gian dự kiến</td>
              </tr></thead>
              <tbody>
                {freqs.map((f) => (
                  <tr key={f} style={{ borderTop: `1px solid ${C.border}` }}>
                    <td style={{ padding: "8px" }}>{f} lệnh/tháng</td>
                    <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace" }}>{monthsToYM(nTrades / f)}</td>
                  </tr>
                ))}
                {observedFreq > 0 && (
                  <tr style={{ borderTop: `1px solid ${C.border}`, background: C.blueDim }}>
                    <td style={{ padding: "8px", color: C.blue, fontWeight: 600 }}>{observedFreq.toFixed(1)} lệnh/tháng (tần suất thực đo từ backtest)</td>
                    <td style={{ padding: "8px", fontFamily: "'JetBrains Mono', monospace", color: C.blue, fontWeight: 600 }}>{monthsToYM(nTrades / observedFreq)}</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

/* v1.27: lời động viên theo cấp độ khi "rót" lợi nhuận vào ống — trung thực, không giả tạo tích cực
   khi đang lỗ (đúng nguyên tắc minh bạch xuyên suốt tool). */
function tierMessage(pct, profit) {
  if (profit < 0) return { text: "Đang lỗ tạm thời trong kỳ này — giữ kỷ luật, đừng cố gỡ vội.", tone: "bear" };
  if (pct >= 100) return { text: "Đầy bình! Đạt mục tiêu kỳ này.", tone: "gold" };
  if (pct >= 75) return { text: "Sắp đầy rồi, giữ vững phong độ!", tone: "bull" };
  if (pct >= 50) return { text: "Hơn nửa đường rồi, tiếp tục!", tone: "blue" };
  if (pct >= 25) return { text: "Đà tốt, cứ vậy mà rót!", tone: "blue" };
  if (pct > 0) return { text: "Giọt đầu tiên đã rót — khởi động tốt!", tone: "neutral" };
  return { text: "Chưa rót giọt nào — chờ lệnh đầu tiên.", tone: "neutral" };
}
function TestTube({ label, pct, profit, target, big, bottomText }) {
  const clamped = Math.max(0, Math.min(100, pct));
  const reached = pct >= 100 && profit >= 0;
  const isLoss = profit < 0;
  const msg = tierMessage(pct, profit);
  const msgColor = msg.tone === "bear" ? C.bear : msg.tone === "gold" ? C.amber : msg.tone === "bull" ? C.bull : msg.tone === "blue" ? C.blue : C.textFaint;

  // v1.32: 2 "chất liệu" khác nhau — ống lớn = "lò phản ứng" tông vàng/hổ phách, ống tháng = "lõi năng lượng" tông xanh lam/ngọc.
  // Trạng thái lỗ luôn chuyển sang đỏ bất kể ống nào, để cảnh báo không bị chìm trong hiệu ứng đẹp mắt.
  const glowRgb = isLoss ? "244,84,91" : big ? "242,184,75" : "91,141,239";
  const liquidGradient = isLoss
    ? "linear-gradient(180deg, #FF8A8F 0%, #F2545B 45%, #8B1E24 100%)"
    : big
    ? "linear-gradient(180deg, #FFE9B8 0%, #F2B84B 40%, #E0782A 100%)"
    : "linear-gradient(180deg, #9FF7DE 0%, #34D399 45%, #5B8DEF 100%)";
  const borderColor = `rgba(${glowRgb},${reached ? 0.95 : 0.55})`;
  const width = big ? 76 : 48;
  const height = big ? 220 : 145;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, width: big ? 172 : 106, flexShrink: 0 }}>
      <div style={{ fontSize: big ? 13 : 11.5, color: C.textDim, textAlign: "center", fontWeight: big ? 700 : 500 }}>{label}</div>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", position: "relative" }}>
        {big && (
          <div style={{ position: "absolute", top: -10, width: width + 34, height: width + 34, borderRadius: "50%", border: `1px solid rgba(242,184,75,0.22)`, pointerEvents: "none" }} />
        )}
        <div style={{ width: width * 0.4, height: 14, background: `linear-gradient(180deg, ${C.surface2}, ${C.surface})`, border: `2px solid ${borderColor}`, borderBottom: "none", borderRadius: "6px 6px 0 0", boxShadow: `0 0 ${big ? 12 : 7}px rgba(${glowRgb},0.5)`, position: "relative", zIndex: 2 }} />
        <div className={reached ? "tt-pulse" : ""} style={{ "--tube-glow": `rgba(${glowRgb},${reached ? 0.75 : 0.4})`, width, height, border: `2px solid ${borderColor}`, borderTop: "none", borderRadius: "0 0 22px 22px", position: "relative", overflow: "hidden", background: `radial-gradient(ellipse at 30% 15%, ${C.surface2} 0%, ${C.bg} 70%)`, boxShadow: `0 0 ${big ? 20 : 11}px rgba(${glowRgb},0.4), inset 0 0 12px rgba(${glowRgb},0.15)` }}>
          <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: `${clamped}%`, background: liquidGradient, transition: "height .6s ease" }} />
          <div className="tt-scan" style={{ position: "absolute", left: 0, right: 0, height: "35%", background: "linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent)", pointerEvents: "none" }} />
          {reached && <div style={{ position: "absolute", top: 4, left: 0, right: 0, textAlign: "center", fontSize: big ? 18 : 13, color: "#FFE9B8", textShadow: "0 0 8px rgba(242,184,75,0.9)" }}>★</div>}
        </div>
      </div>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: big ? 22 : 15, fontWeight: 700, color: isLoss ? C.bear : C.text, textShadow: reached ? `0 0 10px rgba(${glowRgb},0.8)` : "none" }}>{clamped.toFixed(0)}%</div>
      <div style={{ fontSize: 11, color: C.textFaint, textAlign: "center" }}>{bottomText || `${usd(profit)} / ${usd(target)}`}</div>
      <div style={{ fontSize: big ? 12 : 10.5, color: msgColor, textAlign: "center", lineHeight: 1.3 }}>{msg.text}</div>
    </div>
  );
}
function GoalsTab({ capital, setCapital, currentEquity, trades, goalBigTarget, setGoalBigTarget, goalMonthlyPct, setGoalMonthlyPct, goalAdjustments, addGoalAdjustment, deleteGoalAdjustment, goalMonths, addGoalMonth, removeGoalMonth, editGoalMonthPct }) {
  const [editingCapital, setEditingCapital] = useState(false);
  const [capitalInput, setCapitalInput] = useState(capital);
  const [showManual, setShowManual] = useState(false);
  const [manualAmount, setManualAmount] = useState("");
  const [manualNote, setManualNote] = useState("");
  const [manualDate, setManualDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [newMonthInput, setNewMonthInput] = useState(() => new Date().toISOString().slice(0, 7));
  const [newMonthPct, setNewMonthPct] = useState(goalMonthlyPct);
  const [editingMonthKey, setEditingMonthKey] = useState(null);
  const [editingMonthPctInput, setEditingMonthPctInput] = useState(30);

  // v1.30: toàn bộ tab Mục tiêu chỉ tính theo rót thủ công, không tự động cộng từ lệnh đã đóng trong Portfolio.
  // v1.31: ống tháng nào hiển thị do BẠN tự thêm/xóa (goalMonths) — nhưng vốn đầu kỳ vẫn tính đúng theo
  // trình tự thời gian THẬT của mọi lần rót (kể cả ở tháng đã bị ẩn khỏi hiển thị), để không sai lệch.
  // v2.3: mỗi tháng có mục tiêu % RIÊNG (goalMonths lưu {key, targetPct}) thay vì 1 mốc chung cho mọi tháng.
  const monthMap = {};
  goalAdjustments.forEach((a) => {
    const d = new Date(a.date);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    if (!monthMap[key]) monthMap[key] = { profit: 0, count: 0, year: d.getFullYear(), month: d.getMonth() + 1 };
    monthMap[key].profit += a.amount;
    monthMap[key].count += 1;
  });
  const goalMonthKeys = goalMonths.map((m) => m.key);
  const allKeysFull = Array.from(new Set([...Object.keys(monthMap), ...goalMonthKeys])).sort();

  let running = capital;
  const allMonthsComputed = allKeysFull.map((key) => {
    const [y, m] = key.split("-").map(Number);
    const startCapital = running;
    const info = monthMap[key] || { profit: 0, count: 0, year: y, month: m };
    running += info.profit;
    const gm = goalMonths.find((x) => x.key === key);
    const monthPct = gm ? gm.targetPct : goalMonthlyPct;
    const targetProfit = startCapital * (monthPct / 100);
    const pct = targetProfit > 0 ? (info.profit / targetProfit) * 100 : 0;
    return { key, label: `Th.${m}/${String(y).slice(2)}`, ...info, startCapital, targetProfit, pct, monthPct };
  });
  const months = allMonthsComputed.filter((m) => goalMonthKeys.includes(m.key)).slice().reverse(); // mới nhất trước, chỉ ống đang bật

  const adjustmentsTotal = goalAdjustments.reduce((a, x) => a + x.amount, 0);
  const effectiveEquity = capital + adjustmentsTotal;
  // v2.3: ống lớn giờ biểu diễn TỔNG VỐN (gồm cả vốn ban đầu) đạt được so với mốc goalBigTarget —
  // trước đây chỉ tính riêng phần lợi nhuận, không cộng vốn ban đầu, gây hiểu lầm.
  const bigPct = goalBigTarget > 0 ? (effectiveEquity / goalBigTarget) * 100 : 0;
  const monthsReached = months.filter((m) => m.pct >= 100 && m.profit >= 0).length;

  function submitManual() {
    const amt = +manualAmount;
    if (!amt || !manualDate) return;
    const iso = new Date(manualDate + "T12:00:00").toISOString();
    addGoalAdjustment({ amount: amt, date: iso, note: manualNote.trim() || null });
    setManualAmount(""); setManualNote("");
  }
  function submitNewMonth() {
    if (!newMonthInput) return;
    addGoalMonth(newMonthInput, +newMonthPct || 30);
  }
  function startEditMonthPct(m) { setEditingMonthKey(m.key); setEditingMonthPctInput(m.monthPct); }
  function saveEditMonthPct() { if (editingMonthKey) editGoalMonthPct(editingMonthKey, +editingMonthPctInput || 0); setEditingMonthKey(null); }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Card>
        <SectionLabel>Cài đặt mục tiêu</SectionLabel>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px,1fr))", gap: 14 }}>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Vốn ban đầu</div>
            {editingCapital ? (
              <div style={{ display: "flex", gap: 6 }}>
                <input autoFocus type="number" value={capitalInput} onChange={(e) => setCapitalInput(+e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px", color: C.text, width: "100%", fontFamily: "'JetBrains Mono', monospace" }} />
                <button className="tt-btn" onClick={() => { setCapital(capitalInput); setEditingCapital(false); }} style={{ background: C.blue, border: "none", borderRadius: 6, padding: "0 10px", color: "#04101a", fontSize: 12 }}>Lưu</button>
              </div>
            ) : <div onDoubleClick={() => { setCapitalInput(capital); setEditingCapital(true); }} title="Nhấp đúp để sửa" className="tt-tab" style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 18, fontWeight: 700, cursor: "pointer" }}>{usd(capital)}</div>}
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Mục tiêu lớn</div>
            <input type="number" value={goalBigTarget} onChange={(e) => setGoalBigTarget(+e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px", color: C.text, width: "100%", fontFamily: "'JetBrains Mono', monospace", fontSize: 15 }} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Mục tiêu %/tháng mặc định (áp dụng khi thêm ống mới)</div>
            <input type="number" value={goalMonthlyPct} step="1" onChange={(e) => setGoalMonthlyPct(+e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px", color: C.text, width: "100%", fontFamily: "'JetBrains Mono', monospace", fontSize: 15 }} />
          </div>
        </div>
      </Card>

      <Card>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
          <SectionLabel>Rót thủ công — nguồn duy nhất tính vào mục tiêu</SectionLabel>
          {!showManual && <button className="tt-btn" onClick={() => setShowManual(true)} style={{ background: "transparent", border: `1px dashed ${C.borderLight}`, borderRadius: 6, color: C.textDim, fontSize: 12, padding: "5px 12px" }}>+ Rót thủ công</button>}
        </div>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: showManual ? 12 : 0 }}>Toàn bộ ống ở đây chỉ tính theo những gì bạn tự rót — không tự động lấy từ lệnh đã đóng trong Portfolio. Chọn đúng ngày để tiền rót vào đúng ống tháng (vd chọn ngày trong tháng 8 để rót vào ống tháng 8).</div>
        {showManual && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <input type="date" value={manualDate} onChange={(e) => setManualDate(e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
            <input type="number" value={manualAmount} onChange={(e) => setManualAmount(e.target.value)} placeholder="Số tiền (âm nếu lỗ, vd -50)" style={{ width: 170, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
            <input value={manualNote} onChange={(e) => setManualNote(e.target.value)} placeholder="Ghi chú (tùy chọn)" style={{ flex: 1, minWidth: 120, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontSize: 13 }} />
            <button className="tt-btn" onClick={submitManual} disabled={!manualAmount} style={{ background: manualAmount ? C.blue : C.surface, opacity: manualAmount ? 1 : 0.4, border: "none", borderRadius: 6, padding: "8px 14px", color: "#04101a", fontWeight: 600, fontSize: 13 }}>Rót</button>
            <button className="tt-btn" onClick={() => setShowManual(false)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px", color: C.textDim, fontSize: 13 }}>Đóng</button>
          </div>
        )}
        {goalAdjustments.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 6 }}>
            {[...goalAdjustments].sort((a, b) => new Date(b.date) - new Date(a.date)).map((a) => (
              <div key={a.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12.5, padding: "6px 10px", background: C.surface2, borderRadius: 6 }}>
                <span style={{ color: C.textDim }}>{new Date(a.date).toLocaleDateString("vi-VN")} — {a.note || "Rót thủ công"}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", color: a.amount >= 0 ? C.bull : C.bear }}>{a.amount >= 0 ? "+" : ""}{usd(a.amount)}</span>
                  <button className="tt-btn" onClick={() => deleteGoalAdjustment(a.id)} style={{ background: "transparent", border: "none", padding: 2 }}><Icon name="trash" size={13} color={C.textFaint} /></button>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
      <Card>
        <SectionLabel>Đối chiếu tham khảo — vốn thực tế trong Portfolio</SectionLabel>
        <div style={{ fontSize: 12.5, color: C.textFaint }}>Vốn hiện tại theo lệnh đã đóng trong tool: <b style={{ color: C.text, fontFamily: "'JetBrains Mono', monospace" }}>{usd(currentEquity)}</b> — số này KHÔNG tính vào các ống bên dưới, chỉ để bạn đối chiếu nếu cần.</div>
      </Card>

      <Card style={{ border: `1px solid rgba(242,184,75,0.3)`, boxShadow: "0 0 24px rgba(242,184,75,0.08)" }}>
        <SectionLabel>Mục tiêu lớn — ống nghiệm chính</SectionLabel>
        <div style={{ display: "flex", alignItems: "center", gap: 24, flexWrap: "wrap" }}>
          <TestTube label={`${usd(capital)} → ${usd(goalBigTarget)}`} pct={bigPct} profit={adjustmentsTotal} target={goalBigTarget} big bottomText={`${usd(effectiveEquity)} / ${usd(goalBigTarget)}`} />
          <div style={{ flex: 1, minWidth: 160 }}>
            <div style={{ fontSize: 13, color: C.textDim, lineHeight: 1.7 }}>
              <div>Vốn theo mục tiêu (vốn ban đầu + tổng rót thủ công): <b style={{ color: C.text, fontFamily: "'JetBrains Mono', monospace" }}>{usd(effectiveEquity)}</b></div>
              <div>Còn thiếu: <b style={{ color: C.text, fontFamily: "'JetBrains Mono', monospace" }}>{usd(Math.max(0, goalBigTarget - effectiveEquity))}</b></div>
              <div>Số tháng đã đạt mục tiêu tháng: <b style={{ color: C.bull }}>{monthsReached}</b> / {months.length}</div>
            </div>
          </div>
        </div>
      </Card>

      <Card>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
          <SectionLabel>Ống nghiệm theo tháng — tự chọn tháng muốn theo dõi, mục tiêu % riêng từng tháng</SectionLabel>
        </div>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>Mục tiêu mỗi tháng = % bạn đặt riêng cho tháng đó × vốn đầu kỳ của chính tháng đó (không phải vốn ban đầu cố định) — vốn đầu kỳ tự cập nhật theo lãi/lỗ tháng trước, kể cả những tháng bạn đã ẩn ống. Nhấp đúp vào số % dưới mỗi ống để sửa lại bất cứ lúc nào.</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
          <input type="month" value={newMonthInput} onChange={(e) => setNewMonthInput(e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 10px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <input type="number" value={newMonthPct} step="1" onChange={(e) => setNewMonthPct(e.target.value)} style={{ width: 60, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 8px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
            <span style={{ fontSize: 12, color: C.textFaint }}>% mục tiêu</span>
          </div>
          <button className="tt-btn" onClick={submitNewMonth} disabled={!newMonthInput || goalMonths.some((m) => m.key === newMonthInput)} style={{ background: C.blue, border: "none", borderRadius: 6, padding: "7px 14px", color: "#04101a", fontWeight: 600, fontSize: 13, opacity: (!newMonthInput || goalMonths.some((m) => m.key === newMonthInput)) ? 0.4 : 1 }}>+ Thêm ống tháng</button>
          {newMonthInput && goalMonths.some((m) => m.key === newMonthInput) && <span style={{ fontSize: 12, color: C.textFaint }}>Tháng này đã có ống rồi.</span>}
        </div>
        {months.length === 0 ? (
          <div style={{ color: C.textFaint, fontSize: 13 }}>Chưa có ống tháng nào — chọn tháng + % mục tiêu ở trên và bấm "Thêm ống tháng" để bắt đầu.</div>
        ) : (
          <div style={{ display: "flex", gap: 18, overflowX: "auto", paddingBottom: 6 }}>
            {months.map((m) => (
              <div key={m.key} style={{ position: "relative", display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                <button className="tt-btn" onClick={() => removeGoalMonth(m.key)} title="Xóa ống này (không xóa các lần rót đã ghi)" style={{ position: "absolute", top: -4, right: -4, zIndex: 1, width: 20, height: 20, borderRadius: "50%", background: C.surface, border: `1px solid ${C.border}`, color: C.textFaint, fontSize: 12, lineHeight: 1, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
                <TestTube label={`${m.label} (${m.count} lần rót)`} pct={m.pct} profit={m.profit} target={m.targetProfit} />
                {editingMonthKey === m.key ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <input autoFocus type="number" value={editingMonthPctInput} onChange={(e) => setEditingMonthPctInput(+e.target.value)} style={{ width: 48, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 5, padding: "3px 5px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }} />
                    <button className="tt-btn" onClick={saveEditMonthPct} style={{ background: C.blue, border: "none", borderRadius: 5, padding: "3px 8px", color: "#04101a", fontSize: 10.5, fontWeight: 700 }}>Lưu</button>
                  </div>
                ) : (
                  <div onDoubleClick={() => startEditMonthPct(m)} title="Nhấp đúp để sửa mục tiêu %" style={{ fontSize: 10.5, color: C.textFaint, cursor: "pointer" }}>Mục tiêu: {m.monthPct}%</div>
                )}
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CryptoTerminal />);
</script>
</body>
</html>
