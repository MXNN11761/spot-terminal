<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0A0E13; --surface:#12171F; --surface2:#1A212B; --border:#232B36; --borderLight:#2E3844;
    --text:#E7ECF2; --textDim:#8A97A6; --textFaint:#5A6472;
    --bull:#34D399; --bullDim:#0F2E24; --bear:#F2545B; --bearDim:#2E1418;
    --amber:#F2B84B; --amberDim:#2E250F; --blue:#5B8DEF; --blueDim:#131E33;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  /* v1.33: nền vũ trụ — tinh vân mờ + trường sao trôi rất chậm, giữ độ tương phản thấp để không ảnh hưởng
     khả năng đọc số liệu tài chính. Toàn bộ nằm ở lớp nền cố định (position:fixed), nội dung app nằm trên. */
  body {
    background:
      radial-gradient(ellipse 900px 650px at 10% -8%, rgba(91,141,239,0.14), transparent 60%),
      radial-gradient(ellipse 750px 550px at 108% 15%, rgba(52,211,153,0.11), transparent 55%),
      radial-gradient(ellipse 700px 900px at 50% 115%, rgba(139,92,246,0.09), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 12%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 22% 38%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.4px 1.4px at 38% 8%, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 52% 55%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.4px 1.4px at 68% 22%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 78% 60%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.4px 1.4px at 90% 15%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 14% 78%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.4px 1.4px at 60% 85%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 85% 88%, rgba(255,255,255,.3), transparent);
    background-repeat: repeat; background-size: 420px 420px;
    animation: starDrift 140s linear infinite;
  }
  @keyframes starDrift { from{ background-position: 0 0; } to{ background-position: -420px 420px; } }
  @keyframes ttMarquee { from{ transform: translateX(0); } to{ transform: translateX(-50%); } }
  .tt-marquee-track { display: inline-flex; width: max-content; animation: ttMarquee 16s linear infinite; }
  #root { position: relative; z-index: 1; }
  .tt-gradient-text { background: linear-gradient(90deg, #7FF5D0, #5B8DEF 60%, #B79CF2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--borderLight); border-radius: 4px; }
  input, select { outline: none; font-family: inherit; }
  input::placeholder { color: var(--textFaint); }
  .tt-tab { cursor: pointer; transition: color .15s, border-color .15s, text-shadow .15s; }
  .tt-btn { cursor: pointer; transition: opacity .15s, transform .1s, box-shadow .15s; }
  .tt-btn:hover { opacity: .88; }
  .tt-btn:active { transform: scale(0.98); }
  .tt-row:hover { background: var(--surface2); }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes ttGlowPulse { 0%,100%{ box-shadow: 0 0 10px var(--tube-glow, rgba(91,141,239,0.4)), inset 0 0 10px var(--tube-glow, rgba(91,141,239,0.15)); } 50%{ box-shadow: 0 0 22px var(--tube-glow, rgba(91,141,239,0.75)), inset 0 0 14px var(--tube-glow, rgba(91,141,239,0.3)); } }
  @keyframes ttScan { 0%{ transform: translateY(120%); opacity:0; } 12%{ opacity:.55; } 88%{ opacity:.55; } 100%{ transform: translateY(-220%); opacity:0; } }
  .tt-pulse { animation: ttGlowPulse 2.4s ease-in-out infinite; }
  .tt-scan { animation: ttScan 3.2s linear infinite; }
  .spin { animation: spin 1s linear infinite; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
</style>

/* ============================== MATH / INDICATORS ============================== */
function smaCalc(vals, period) {
  const out = new Array(vals.length).fill(null);
  let sum = 0;
  for (let i = 0; i < vals.length; i++) {
    sum += vals[i];
    if (i >= period) sum -= vals[i - period];
    if (i >= period - 1) out[i] = sum / period;
  }
  return out;
}
function emaCalc(vals, period) {
  const out = new Array(vals.length).fill(null);
  const k = 2 / (period + 1);
  let prev = null;
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] == null) continue;
    if (prev == null) {
      if (i >= period - 1) {
        const seed = vals.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
        prev = seed; out[i] = seed;
      }
    } else { prev = vals[i] * k + prev * (1 - k); out[i] = prev; }
  }
  return out;
}
function rsiCalc(closes, period = 14) {
  const out = new Array(closes.length).fill(null);
  let gainSum = 0, lossSum = 0;
  for (let i = 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    const gain = diff > 0 ? diff : 0;
    const loss = diff < 0 ? -diff : 0;
    if (i <= period) {
      gainSum += gain; lossSum += loss;
      if (i === period) { const rs = lossSum === 0 ? 100 : gainSum / lossSum; out[i] = 100 - 100 / (1 + rs); }
    } else {
      gainSum = (gainSum * (period - 1) + gain) / period;
      lossSum = (lossSum * (period - 1) + loss) / period;
      const rs = lossSum === 0 ? 100 : gainSum / lossSum;
      out[i] = 100 - 100 / (1 + rs);
    }
  }
  return out;
}
function macdCalc(closes, fast = 12, slow = 26, signalP = 9) {
  const emaFast = emaCalc(closes, fast);
  const emaSlow = emaCalc(closes, slow);
  const line = closes.map((_, i) => (emaFast[i] != null && emaSlow[i] != null ? emaFast[i] - emaSlow[i] : null));
  const cleanLine = line.map((v) => (v == null ? 0 : v));
  const signal = emaCalc(cleanLine, signalP);
  const hist = line.map((v, i) => (v != null && signal[i] != null ? v - signal[i] : null));
  return { line, signal, hist };
}
function bollingerCalc(closes, period = 20, mult = 2) {
  const mid = smaCalc(closes, period);
  const upper = new Array(closes.length).fill(null);
  const lower = new Array(closes.length).fill(null);
  for (let i = period - 1; i < closes.length; i++) {
    const slice = closes.slice(i - period + 1, i + 1);
    const m = mid[i];
    const variance = slice.reduce((a, b) => a + (b - m) ** 2, 0) / period;
    const sd = Math.sqrt(variance);
    upper[i] = m + mult * sd; lower[i] = m - mult * sd;
  }
  return { mid, upper, lower };
}
/* v1.23: chu kỳ dao động Bollinger LB→UB — đo thời gian trung bình từ lúc giá chạm/xuyên dải dưới (LB)
   đến lần đầu chạm/xuyên dải trên (UB) sau đó, tính trên các chu kỳ HOÀN THÀNH trong 7 ngày gần nhất.
   "Chạm/xuyên" dùng low<=LB và high>=UB (tính cả bấc nến, không chỉ giá đóng cửa). Nếu giá đang trong xu
   hướng mạnh chỉ bám 1 dải mà không có chu kỳ hoàn chỉnh nào trong 7 ngày, trả về null (không suy diễn). */
function computeBollCycleStats(klines) {
  if (!klines || klines.length < 25) return null;
  const closes = klines.map((k) => k.close);
  const bb = bollingerCalc(closes, 20, 2);
  const n = klines.length;
  const windowStart = klines[n - 1].time - 7 * 24 * 60 * 60 * 1000;
  let waitingSinceLB = null;
  const durationsMin = [];
  for (let i = 0; i < n; i++) {
    if (bb.upper[i] == null || bb.lower[i] == null) continue;
    const touchedLB = klines[i].low <= bb.lower[i];
    const touchedUB = klines[i].high >= bb.upper[i];
    if (waitingSinceLB === null) {
      if (touchedLB) waitingSinceLB = klines[i].time;
    } else if (touchedUB) {
      if (klines[i].time >= windowStart) durationsMin.push((klines[i].time - waitingSinceLB) / 60000);
      waitingSinceLB = null;
    } else if (touchedLB) {
      waitingSinceLB = klines[i].time; // cập nhật về lần chạm LB gần nhất trước khi có UB
    }
  }
  if (!durationsMin.length) return null;
  return { avgMinutes: durationsMin.reduce((a, b) => a + b, 0) / durationsMin.length, count: durationsMin.length };
}
/* v1.25: nhận diện mẫu nến đảo chiều tại nến i — chỉ dùng nến i và i-1 (không nhìn tương lai, an toàn
   cho backtest). Định nghĩa toán học rõ ràng, không suy diễn theo "hình dạng nhìn bằng mắt":
   - Nhấn chìm tăng/giảm (Engulfing): thân nến hiện tại bao trọn thân nến trước, ngược chiều nhau.
   - Búa (Hammer) / Sao băng (Shooting Star): thân nhỏ, 1 bấc dài gấp ≥2 lần thân, bấc còn lại rất ngắn.
   - Doji: thân nến ≤10% biên độ nến — chỉ hiển thị để tham khảo, không tính điểm (tránh nhiễu vì
     doji đơn lẻ không đủ rõ ràng về hướng). */
function detectCandlePattern(opens, highs, lows, closes, i) {
  if (i < 1) return null;
  const o = opens[i], h = highs[i], l = lows[i], c = closes[i];
  const po = opens[i - 1], pc = closes[i - 1];
  const body = Math.abs(c - o);
  const range = h - l;
  if (range <= 0) return null;
  const upperWick = h - Math.max(o, c);
  const lowerWick = Math.min(o, c) - l;

  if (pc < po && c > o && o <= pc && c >= po) return { name: "Nhấn chìm tăng (Bullish Engulfing)", score: 1 };
  if (pc > po && c < o && o >= pc && c <= po) return { name: "Nhấn chìm giảm (Bearish Engulfing)", score: -1 };
  if (body > 0 && lowerWick >= 2 * body && upperWick <= 0.3 * body) return { name: "Búa tăng (Hammer)", score: 0.7 };
  if (body > 0 && upperWick >= 2 * body && lowerWick <= 0.3 * body) return { name: "Sao băng/Búa treo (Shooting Star)", score: -0.7 };
  if (body <= 0.1 * range) return { name: "Doji — thị trường lưỡng lự (không tính điểm)", score: 0 };
  return null;
}

function quickDetectExchange(lower) { return /okx/.test(lower) ? "OKX" : "BINANCE"; }
function quickExtractCount(lower) { const m = lower.match(/\d+/); return m ? Math.min(20, Math.max(1, parseInt(m[0], 10))) : 10; }
function quickExtractSymbol(rawQ) {
  const lower = rawQ.toLowerCase();
  for (const name in QUICK_COIN_NAME_MAP) { if (lower.includes(name)) return QUICK_COIN_NAME_MAP[name]; }
  const tokens = rawQ.split(/\s+/).map((t) => t.replace(/[^a-zA-Z0-9]/g, ""));
  for (const t of tokens) {
    if (t.length >= 2 && t.length <= 10 && /^[a-zA-Z]+$/.test(t) && !QUICK_STOPWORDS.has(t.toLowerCase())) return t.toUpperCase();
  }
  return null;
}
function parseQuickQuery(rawQ) {
  const q = rawQ.trim();
  if (!q) return null;
  const lower = q.toLowerCase();
  const exchange = quickDetectExchange(lower);
  const isTopList = /(top|danh sách|danh sach)/.test(lower) && /(tăng|tang|giảm|giam)/.test(lower);
  const isTopVolume = /(khối lượng|khoi luong)/.test(lower) && /(lớn nhất|lon nhat|top|danh sách|danh sach)/.test(lower);
  const isVolume = /(khối lượng|khoi luong|volume|thanh khoản|thanh khoan)/.test(lower);
  const isPrice = /\bgiá\b|\bgia\b/.test(lower);
  if (isTopList) {
    const direction = /giảm|giam/.test(lower) && !/tăng|tang/.test(lower) ? "loser" : "gainer";
    return { type: "toplist", exchange, count: quickExtractCount(lower), direction };
  }
  if (isTopVolume) return { type: "topvolume", exchange, count: quickExtractCount(lower) };
  if (isVolume) { const symbol = quickExtractSymbol(q); return symbol ? { type: "volume", exchange, symbol } : { type: "unknown" }; }
  if (isPrice) { const symbol = quickExtractSymbol(q); return symbol ? { type: "price", exchange, symbol } : { type: "unknown" }; }
  return { type: "unknown" };
}

function atrCalc(highs, lows, closes, period = 14) {
  const tr = highs.map((h, i) => {
    if (i === 0) return h - lows[i];
    return Math.max(h - lows[i], Math.abs(h - closes[i - 1]), Math.abs(lows[i] - closes[i - 1]));
  });
  const out = new Array(tr.length).fill(null);
  let prev = null;
  for (let i = 0; i < tr.length; i++) {
    if (i === period - 1) { prev = tr.slice(0, period).reduce((a, b) => a + b, 0) / period; out[i] = prev; }
    else if (i >= period) { prev = (prev * (period - 1) + tr[i]) / period; out[i] = prev; }
  }
  return out;
}
function swingLevels(highs, lows, lookback = 40, wnd = 3) {
  const start = Math.max(0, highs.length - lookback);
  let resistance = null, support = null;
  for (let i = start + wnd; i < highs.length - wnd; i++) {
    const hSlice = highs.slice(i - wnd, i + wnd + 1);
    const lSlice = lows.slice(i - wnd, i + wnd + 1);
    if (highs[i] === Math.max(...hSlice)) resistance = resistance == null ? highs[i] : Math.min(resistance, highs[i]);
    if (lows[i] === Math.min(...lSlice)) support = support == null ? lows[i] : Math.max(support, lows[i]);
  }
  return { support, resistance };
}

async function fetchBinanceKlines(symbol, interval = "4h", limit = 150) {

/* ============================== SIGNAL ENGINE ============================== */
function analyzeSymbol(klines) {
  if (!klines || klines.length < 30) return null;
  const closes = klines.map((k) => k.close);
  const highs = klines.map((k) => k.high);
  const lows = klines.map((k) => k.low);
  const vols = klines.map((k) => k.volume);
  const last = klines.length - 1;

  const ema20 = emaCalc(closes, 20);
  const ema50 = emaCalc(closes, 50);
  const rsiArr = rsiCalc(closes, 14);
  const macdRes = macdCalc(closes);
  const bb = bollingerCalc(closes, 20, 2);
  const atrArr = atrCalc(highs, lows, closes, 14);
  const volSma = smaCalc(vols, 20);
  const { support, resistance } = swingLevels(highs, lows, 50, 3);

  const price = closes[last];
  const curEma20 = ema20[last], curEma50 = ema50[last];
  const curRsi = rsiArr[last];
  const curHist = macdRes.hist[last];
  const prevHist = macdRes.hist[last - 1];
  const curAtr = atrArr[last] || price * 0.02;
  const curVolSma = volSma[last] || vols[last];
  const volRatio = curVolSma ? vols[last] / curVolSma : 1;
  const bullCandle = closes[last] > klines[last].open;

  let score = 0;
  let momentumCore = 0; // v1.6: chỉ tính Xu hướng + MACD + Volume — không gồm phạt RSI/Bollinger quá mua
  let overheated = false; // v1.6: true nếu RSI>70 hoặc giá vượt biên trên Bollinger — dấu hiệu "quá nóng"
  const reasons = [];

  if (curEma20 != null && curEma50 != null) {
    if (curEma20 > curEma50) { score += 1; momentumCore += 1; reasons.push({ t: "Xu hướng", v: "EMA20 > EMA50 — xu hướng tăng ngắn hạn", dir: 1 }); }
    else { score -= 1; momentumCore -= 1; reasons.push({ t: "Xu hướng", v: "EMA20 < EMA50 — xu hướng giảm ngắn hạn", dir: -1 }); }
  }
  if (curRsi != null) {
    if (curRsi >= 45 && curRsi <= 65) { score += 1; reasons.push({ t: "Động lượng (RSI)", v: `RSI=${curRsi.toFixed(0)} — vùng khỏe, chưa quá mua`, dir: 1 }); }
    else if (curRsi > 70) { score -= 1; overheated = true; reasons.push({ t: "Động lượng (RSI)", v: `RSI=${curRsi.toFixed(0)} — quá mua, rủi ro điều chỉnh`, dir: -1 }); }
    else if (curRsi < 30) { score += 0.5; reasons.push({ t: "Động lượng (RSI)", v: `RSI=${curRsi.toFixed(0)} — quá bán, có thể hồi kỹ thuật`, dir: 1 }); }
    else { reasons.push({ t: "Động lượng (RSI)", v: `RSI=${curRsi.toFixed(0)} — trung tính`, dir: 0 }); }
  }
  if (curHist != null && prevHist != null) {
    if (curHist > 0 && curHist > prevHist) { score += 1; momentumCore += 1; reasons.push({ t: "MACD", v: "Histogram dương và mở rộng — động lượng tăng", dir: 1 }); }
    else if (curHist < 0 && curHist < prevHist) { score -= 1; momentumCore -= 1; reasons.push({ t: "MACD", v: "Histogram âm và mở rộng — động lượng giảm", dir: -1 }); }
    else { reasons.push({ t: "MACD", v: "Đang đổi chiều / trung tính", dir: 0 }); }
  }
  if (volRatio > 1.4) {
    if (bullCandle) { score += 1; momentumCore += 1; reasons.push({ t: "VPA (Volume)", v: `Volume=${volRatio.toFixed(1)}x TB, nến tăng — xác nhận lực mua`, dir: 1 }); }
    else { score -= 1; momentumCore -= 1; reasons.push({ t: "VPA (Volume)", v: `Volume=${volRatio.toFixed(1)}x TB, nến giảm — xác nhận lực bán`, dir: -1 }); }
  } else {
    reasons.push({ t: "VPA (Volume)", v: `Volume=${volRatio.toFixed(1)}x TB — không có dấu hiệu bất thường`, dir: 0 });
  }
  const bbUpper = bb.upper[last], bbLower = bb.lower[last], bbMid = bb.mid[last], bbMidPrev = bb.mid[last - 1];
  if (bbUpper && bbLower && bbMid != null) {
    const posPct = (price - bbLower) / (bbUpper - bbLower);
    const crossedBelowMid = bbMidPrev != null && closes[last - 1] >= bbMidPrev && price < bbMid;
    const crossedAboveMid = bbMidPrev != null && closes[last - 1] <= bbMidPrev && price > bbMid;
    if (posPct <= 0.05) { score += 2; reasons.push({ t: "Bollinger Band", v: "Giá sát/dưới biên dưới — vùng quá bán mạnh", dir: 1 }); }
    else if (posPct >= 0.95) { score -= 2; overheated = true; reasons.push({ t: "Bollinger Band", v: "Giá sát/trên biên trên — vùng quá mua mạnh", dir: -1 }); }
    else if (crossedBelowMid) { score += 0.5; reasons.push({ t: "Bollinger Band", v: "Giá vừa xuyên xuống dưới đường trung bình BOL — có thể là nhịp điều chỉnh mua vào", dir: 1 }); }
    else if (crossedAboveMid) { score -= 0.5; reasons.push({ t: "Bollinger Band", v: "Giá vừa xuyên lên trên đường trung bình BOL — có thể là nhịp hồi trong xu hướng giảm", dir: -1 }); }
    else { reasons.push({ t: "Bollinger Band", v: "Giá trong dải, không có tín hiệu rõ", dir: 0 }); }
  }
  // v1.25: mẫu nến đảo chiều — tín hiệu thứ 6, chỉ nhìn nến hiện tại + nến trước (không nhìn tương lai).
  const candlePattern = detectCandlePattern(klines.map((k) => k.open), highs, lows, closes, last);
  if (candlePattern) {
    score += candlePattern.score;
    reasons.push({ t: "Mẫu nến", v: candlePattern.name, dir: candlePattern.score > 0 ? 1 : candlePattern.score < 0 ? -1 : 0 });
  }

  // v1.25: thang điểm tối đa lý thuyết đã tăng từ ±4 lên ±7 (Bollinger tối đa ±2, mẫu nến tối đa ±1) —
  // quy đổi độ tin cậy và ngưỡng LONG/TRÁNH theo đúng tỷ lệ cũ (ngưỡng cũ = 50% thang điểm) để giữ nguyên
  // triết lý "cần nhiều tín hiệu cùng xác nhận", tránh 1 mình Bollinger đã đủ kích hoạt LONG.
  const MAX_SCORE = 7;
  const confidence = Math.max(0, Math.min(100, Math.round(((score + MAX_SCORE) / (2 * MAX_SCORE)) * 100)));
  // v1.6: nếu xu hướng+MACD+volume đều mạnh (momentumCore >= 2) nhưng bị phạt điểm vì quá mua (overheated)
  // khiến không đạt ngưỡng LONG, đây KHÔNG phải "trung lập" thật — gắn nhãn riêng để không đánh đồng
  // 2 tình huống khác bản chất: "không có gì xảy ra" vs "đang xảy ra rất mạnh nhưng quá nóng để vào an toàn".
  const LONG_THRESHOLD = 3.5, AVOID_THRESHOLD = -3.5;
  const direction = score >= LONG_THRESHOLD ? "LONG"
    : (momentumCore >= 2 && overheated) ? "BREAKOUT NÓNG — RỦI RO CAO"
    : score <= AVOID_THRESHOLD ? "TRÁNH/THEO DÕI GIẢM"
    : "TRUNG LẬP";

  const entry = price;
  let stop = null, target = null, risk = null, reward = null, rr = null, pctTarget = null, pctStop = null, estHoldBars = null;
  const isReferenceOnly = direction === "TRUNG LẬP"; // v2.3: TRUNG LẬP vẫn hiện số liệu nhưng gắn cờ "chỉ tham khảo"
  if (direction === "LONG" || direction === "TRUNG LẬP") {
    // v1.3: chọn stop XA hơn (an toàn hơn) giữa cấu trúc hỗ trợ và ATR — tránh bị quét bởi nhiễu giá ngắn hạn.
    // Giới hạn khoảng cách rủi ro trong 0.8%-3% giá để R:R tối thiểu 1:2.2 luôn khả thi trong mức trần mục tiêu.
    const atrStop = entry - 1.0 * curAtr;
    const structStop = support ? support * 0.995 : atrStop;
    const rawStopDist = entry - Math.min(structStop, atrStop);
    const stopDist = Math.min(Math.max(rawStopDist, entry * 0.008), entry * 0.03);
    stop = entry - stopDist;
    const risk0 = stopDist;
    const targetFloor = entry + risk0 * 2.2; // ép R:R tối thiểu 1:2.2
    // v1.26: biên trên Bollinger giờ cũng là 1 ứng viên tính Target, cùng với vùng kháng cự — chọn mức
    // GẦN HƠN (thận trọng hơn, dễ chạm hơn) trong 2 mức, thay vì chỉ dùng riêng vùng kháng cự như trước.
    const targetCandidates = [];
    if (resistance && resistance > entry) targetCandidates.push(resistance * 0.997);
    if (bbUpper && bbUpper > entry) targetCandidates.push(bbUpper * 0.997);
    const structTarget = targetCandidates.length ? Math.min(...targetCandidates) : targetFloor;
    target = Math.min(Math.max(targetFloor, structTarget), entry * 1.07);
    risk = Math.abs(entry - stop);
    reward = Math.abs(target - entry);
    rr = risk > 0 ? +(reward / risk).toFixed(2) : null;
    pctTarget = +(((target - entry) / entry) * 100).toFixed(2);
    pctStop = +(((stop - entry) / entry) * 100).toFixed(2);
    // v1.16: ước tính số nến cần để đi hết quãng đường đến target, dựa trên biến động trung bình/nến (ATR).
    // Đây là ước lượng thống kê từ biến động quá khứ, KHÔNG phải cam kết thời gian thực tế — giá có thể
    // đến target nhanh hơn hoặc chậm hơn nhiều tùy diễn biến thị trường.
    estHoldBars = curAtr > 0 ? Math.max(1, Math.ceil(reward / curAtr)) : null;
  }
  // v1.5: TRUNG LẬP/TRÁNH không còn tính stop/target kiểu "ngược" (dành cho short) — vì đây là tool spot chỉ mua,
  // hiển thị số cho hướng không giao dịch được sẽ gây hiểu nhầm (đây chính là lỗi đã xảy ra ở v1.4: target < entry
  // dù nhãn ghi "chốt lời"). Khi không phải LONG, stop/target/rr trả về null để giao diện tự ẩn đúng cách.

  return { price, score, momentumCore, overheated, confidence, direction, reasons, entry, stop, target, rr, pctTarget, pctStop, support, resistance, curRsi, volRatio, curAtr, estHoldBars, isReferenceOnly };
}

/* ============================== BACKTEST ENGINE ==============================
   Chạy lại đúng công thức tín hiệu của analyzeSymbol() trên dữ liệu lịch sử,
   nhưng tại mỗi nến i chỉ dùng dữ liệu có sẵn đến i (không nhìn trước tương lai).
   Vùng hỗ trợ/kháng cự dùng cửa sổ lùi (rolling, causal) thay vì swingLevels 2 chiều
   để tránh lookahead bias. Mỗi lệnh mở xong sẽ mô phỏng đến khi chạm stop/target
   hoặc hết thời gian giữ tối đa, rồi mới xét tín hiệu tiếp theo (không chồng lệnh). */
function runBacktest(klines, opts = {}) {
  const maxHoldBars = opts.maxHoldBars || 30;
  const srWindow = opts.srWindow || 20;
  if (!klines || klines.length < 80) return { trades: [], error: "Không đủ dữ liệu lịch sử (cần tối thiểu ~80 nến)." };

  const closes = klines.map((k) => k.close);
  const highs = klines.map((k) => k.high);
  const lows = klines.map((k) => k.low);
  const vols = klines.map((k) => k.volume);
  const opens = klines.map((k) => k.open);

  const ema20 = emaCalc(closes, 20);
  const ema50 = emaCalc(closes, 50);
  const rsiArr = rsiCalc(closes, 14);
  const macdRes = macdCalc(closes);
  const bb = bollingerCalc(closes, 20, 2);
  const atrArr = atrCalc(highs, lows, closes, 14);
  const volSma = smaCalc(vols, 20);

  const trades = [];
  let i = 55;
  while (i < klines.length - 2) {
    let support = null, resistance = null;
    if (i >= srWindow) {
      support = Math.min(...lows.slice(i - srWindow + 1, i + 1));
      resistance = Math.max(...highs.slice(i - srWindow + 1, i + 1));
    }
    const curEma20 = ema20[i], curEma50 = ema50[i], curRsi = rsiArr[i];
    const curHist = macdRes.hist[i], prevHist = macdRes.hist[i - 1];
    const curAtr = atrArr[i] || closes[i] * 0.02;
    const curVolSma = volSma[i] || vols[i];
    const volRatio = curVolSma ? vols[i] / curVolSma : 1;
    const bullCandle = closes[i] > opens[i];
    const bbUpper = bb.upper[i], bbLower = bb.lower[i], bbMid = bb.mid[i], bbMidPrev = bb.mid[i - 1];

    let score = 0;
    if (curEma20 != null && curEma50 != null) score += curEma20 > curEma50 ? 1 : -1;
    if (curRsi != null) {
      if (curRsi >= 45 && curRsi <= 65) score += 1;
      else if (curRsi > 70) score -= 1;
      else if (curRsi < 30) score += 0.5;
    }
    if (curHist != null && prevHist != null) {
      if (curHist > 0 && curHist > prevHist) score += 1;
      else if (curHist < 0 && curHist < prevHist) score -= 1;
    }
    if (volRatio > 1.4) score += bullCandle ? 1 : -1;
    if (bbUpper && bbLower && bbMid != null) {
      const posPct = (closes[i] - bbLower) / (bbUpper - bbLower);
      const crossedBelowMid = bbMidPrev != null && closes[i - 1] >= bbMidPrev && closes[i] < bbMid;
      const crossedAboveMid = bbMidPrev != null && closes[i - 1] <= bbMidPrev && closes[i] > bbMid;
      if (posPct <= 0.05) score += 2;
      else if (posPct >= 0.95) score -= 2;
      else if (crossedBelowMid) score += 0.5;
      else if (crossedAboveMid) score -= 0.5;
    }
    const candlePattern = detectCandlePattern(opens, highs, lows, closes, i);
    if (candlePattern) score += candlePattern.score;

    const LONG_THRESHOLD = 3.5, AVOID_THRESHOLD = -3.5;
    const direction = score >= LONG_THRESHOLD ? "LONG" : score <= AVOID_THRESHOLD ? "AVOID" : "NEUTRAL";

    if (direction === "LONG") {
      const entry = closes[i];
      const atrStop = entry - 1.0 * curAtr;
      const structStop = support ? support * 0.995 : atrStop;
      const rawStopDist = entry - Math.min(structStop, atrStop);
      const stopDist = Math.min(Math.max(rawStopDist, entry * 0.008), entry * 0.03);
      const stop = entry - stopDist;
      const risk0 = stopDist;
      const targetFloor = entry + risk0 * 2.2;
      const targetCandidates = [];
      if (resistance && resistance > entry) targetCandidates.push(resistance * 0.997);
      if (bbUpper && bbUpper > entry) targetCandidates.push(bbUpper * 0.997);
      const structTarget = targetCandidates.length ? Math.min(...targetCandidates) : targetFloor;
      const target = Math.min(Math.max(targetFloor, structTarget), entry * 1.07);

      let exitIdx = null, exitPrice = null, outcome = null;
      for (let j = i + 1; j <= Math.min(i + maxHoldBars, klines.length - 1); j++) {
        if (lows[j] <= stop) { exitPrice = stop; exitIdx = j; outcome = "loss"; break; }
        if (highs[j] >= target) { exitPrice = target; exitIdx = j; outcome = "win"; break; }
      }
      if (exitIdx == null) {
        exitIdx = Math.min(i + maxHoldBars, klines.length - 1);
        exitPrice = closes[exitIdx];
        outcome = exitPrice > entry ? "win" : "loss";
      }
      const pnlPct = ((exitPrice - entry) / entry) * 100;
      trades.push({ entryTime: klines[i].time, exitTime: klines[exitIdx].time, entry, exitPrice, pnlPct, outcome, barsHeld: exitIdx - i });
      i = exitIdx + 1;
    } else {
      i++;
    }
  }
  const spanMonths = (klines[klines.length - 1].time - klines[0].time) / (1000 * 60 * 60 * 24 * 30.44);
  return { trades, spanMonths };
}
function summarizeTrades(trades) {
  if (!trades || !trades.length) return null;
  const wins = trades.filter((t) => t.pnlPct > 0);
  const losses = trades.filter((t) => t.pnlPct <= 0);
  const winRate = wins.length / trades.length;
  const avgWin = wins.length ? wins.reduce((a, t) => a + t.pnlPct, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a, t) => a + t.pnlPct, 0) / losses.length : 0;
  const avgR = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : null;
  const grossProfit = wins.reduce((a, t) => a + t.pnlPct, 0);
  const grossLoss = Math.abs(losses.reduce((a, t) => a + t.pnlPct, 0));
  const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : null;
  const logSum = trades.reduce((a, t) => a + Math.log(1 + t.pnlPct / 100), 0);
  const growthPerTrade = Math.exp(logSum / trades.length) - 1;
  const avgBarsHeld = trades.reduce((a, t) => a + t.barsHeld, 0) / trades.length;
  return { total: trades.length, winRate, avgWin, avgLoss, avgR, profitFactor, growthPerTrade, avgBarsHeld };
}

/* ============================== COMPOUNDING PROJECTION ============================== */
function growthFromWinRateRR(winRate, risk, rr) {
  const reward = risk * rr;
  const gWin = Math.log(1 + reward);
  const gLoss = Math.log(1 - risk);
  const gAvg = winRate * gWin + (1 - winRate) * gLoss;
  return Math.exp(gAvg) - 1;
}
function tradesNeeded(startCapital, targetCapital, growthPerTrade) {
  if (!growthPerTrade || growthPerTrade <= 0) return null;
  return Math.ceil(Math.log(targetCapital / startCapital) / Math.log(1 + growthPerTrade));
}
function monthsToYM(months) {
  if (months == null || !isFinite(months)) return "—";
  let y = Math.floor(months / 12);
  let m = +(months - y * 12).toFixed(1);
  if (m >= 12) { y += 1; m = +(m - 12).toFixed(1); }
  return y > 0 ? `${y} năm ${m} tháng` : `${m} tháng`;
}

function fmt(n, digits = 2) {
  if (n == null || isNaN(n)) return "—";
  if (Math.abs(n) < 1) return n.toLocaleString("en-US", { maximumFractionDigits: 6 });
  return n.toLocaleString("en-US", { maximumFractionDigits: digits });
}
function usd(n) { return n == null || isNaN(n) ? "—" : `$${fmt(n)}`; }

/* Custom SVG equity chart (thay recharts) */
function EquityChart({ data, capital }) {
  if (!data || data.length < 2) return null;
  const W = 760, H = 220, PAD = 30;
  const values = data.map((d) => d.equity);
  const min = Math.min(...values, capital) * 0.98;
  const max = Math.max(...values, capital) * 1.02;
  const xStep = (W - PAD * 2) / (data.length - 1);
  const yFor = (v) => H - PAD - ((v - min) / (max - min || 1)) * (H - PAD * 2);
  const points = data.map((d, i) => `${PAD + i * xStep},${yFor(d.equity)}`).join(" ");
  const capY = yFor(capital);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 220 }}>
      <line x1={PAD} y1={capY} x2={W - PAD} y2={capY} stroke={C.textFaint} strokeDasharray="4 4" strokeWidth="1" />
      <polyline points={points} fill="none" stroke={C.blue} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((d, i) => <circle key={i} cx={PAD + i * xStep} cy={yFor(d.equity)} r="3" fill={C.blue} />)}
      <text x={PAD} y={14} fill={C.textFaint} fontSize="11" fontFamily="JetBrains Mono">{fmt(max)}</text>
      <text x={PAD} y={H - 8} fill={C.textFaint} fontSize="11" fontFamily="JetBrains Mono">{fmt(min)}</text>
    </svg>
  );
}

  const [dayTradeScanning, setDayTradeScanning] = useState(false);
  const [dayTradeError, setDayTradeError] = useState(null);
  const [dayTradeDiag, setDayTradeDiag] = useState(null); // { poolSize, inRangeCount, checkedCount, nearMiss: [...] }
  const [includeBreakout, setIncludeBreakout] = useState(false);
  const [rangeMin, setRangeMin] = useState(5);
  const [rangeMax, setRangeMax] = useState(10);
  const [minTargetPct, setMinTargetPct] = useState(2);
  const [scanInterval, setScanInterval] = useState("15m");
  const [plannedCapital, setPlannedCapital] = useState(100);
  const [installPrompt, setInstallPrompt] = useState(null);
  const [isStandalone, setIsStandalone] = useState(false);
  const [showIOSHelp, setShowIOSHelp] = useState(false);
  const [installDismissed, setInstallDismissed] = useState(false);
  const [quickChatOpen, setQuickChatOpen] = useState(false);
  const [quickChatInput, setQuickChatInput] = useState("");
  const [quickChatMessages, setQuickChatMessages] = useState([]);
  const [quickChatLoading, setQuickChatLoading] = useState(false);
  async function handleQuickAsk() {
    const q = quickChatInput.trim();
    if (!q || quickChatLoading) return;
    setQuickChatMessages((prev) => [...prev, { role: "user", text: q }]);
    setQuickChatInput("");
    setQuickChatLoading(true);
    const parsed = parseQuickQuery(q);
    const answer = await executeQuickQuery(parsed);
    setQuickChatMessages((prev) => [...prev, { role: "tool", text: answer }]);
    setQuickChatLoading(false);
  }

  const scanDayTrade = useCallback(async () => {
    setDayTradeScanning(true); setDayTradeError(null);
    try {
      const poolMap = {};
      watchlist.forEach((sym) => {
        const t = tickers[sym];
        if (t) poolMap[sym] = { symbol: sym, lastPrice: +t.lastPrice, highPrice: +t.highPrice, lowPrice: +t.lowPrice, quoteVolume: +t.quoteVolume };
      });
      topVolume.forEach((t) => { if (!poolMap[t.symbol]) poolMap[t.symbol] = t; });
      const pool = Object.values(poolMap).filter((t) => t.lastPrice > 0 && t.highPrice > 0 && t.lowPrice > 0);
      const candidates = pool
        .map((t) => ({ ...t, rangePct: ((t.highPrice - t.lowPrice) / t.lastPrice) * 100 }))
        .filter((t) => t.rangePct >= rangeMin && t.rangePct <= rangeMax);

      // v2.5: quét ĐỒNG THỜI nhiều khung thời gian (15m/1h/4h) cho mỗi coin thay vì chỉ 1 khung —
      // tăng cơ hội tìm thấy tín hiệu thật mỗi ngày mà KHÔNG hạ ngưỡng LONG ở bất kỳ khung nào.
      // Lấy kết quả điểm cao nhất trong 3 khung để đại diện cho coin đó, ghi rõ khung nào đã kích hoạt.
      const TIMEFRAMES_TO_SCAN = ["15m", "1h", "4h"];
      const allChecked = [];
      for (const c of candidates) {
        let best = null;
        for (const tf of TIMEFRAMES_TO_SCAN) {
          try {
            const klines = await fetchBinanceKlines(c.symbol, tf, 150);
            const r = analyzeSymbol(klines);
            if (!r) continue;
            const estHoldMinutes = r.estHoldBars != null ? r.estHoldBars * (INTERVAL_MINUTES[tf] || 15) : null;
            const candidateResult = { ...c, ...r, symbol: c.symbol, interval: tf, estHoldMinutes };
            if (!best || candidateResult.score > best.score) best = candidateResult;
          } catch (e) { /* bỏ qua khung lỗi cho coin này, không chặn cả lượt quét */ }
        }
        if (best) allChecked.push(best);
      }

      // v2.5: lọc thêm theo đúng mục tiêu lợi nhuận tối thiểu (mặc định 2%) — không hạ chuẩn điểm số,
      // chỉ đảm bảo coin lọt vào danh sách THẬT SỰ có target đủ lớn theo đúng yêu cầu của người dùng.
      const longs = allChecked.filter((r) => r.direction === "LONG" && r.pctTarget != null && r.pctTarget >= minTargetPct);
      const breakouts = allChecked.filter((r) => r.direction.includes("NÓNG"));
      let final = includeBreakout ? [...longs, ...breakouts] : longs;
      final.sort((a, b) => b.quoteVolume - a.quoteVolume);
      final = final.slice(0, 5);

      // v2.5: hạng "Khá" — điểm 2.5-3.5 (chưa đạt ngưỡng LONG ≥3.5) nhưng vẫn đạt target tối thiểu —
      // hiển thị MINH BẠCH, tách riêng, ghi rõ độ tin cậy thấp hơn, để người dùng TỰ quyết định thay vì
      // tool âm thầm ẩn đi mọi thứ dưới ngưỡng.
      const tier2 = allChecked
        .filter((r) => r.direction === "TRUNG LẬP" && r.score >= 2.5 && r.score < 3.5 && r.pctTarget != null && r.pctTarget >= minTargetPct)
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);

      // v1.23/v2.3: chu kỳ BOLL 1H cố định + khung đã kích hoạt tín hiệu (song song) — chỉ tính cho
      // các coin lọt vào 2 danh sách cuối, giữ chi phí gọi API thấp.
      async function attachBollCycles(list) {
        for (const r of list) {
          try {
            const klines1h = await fetchBinanceKlines(r.symbol, "1h", 200);
            r.bollCycle1h = computeBollCycleStats(klines1h);
            if (r.interval === "1h") { r.bollCycleScan = r.bollCycle1h; }
            else { try { const klinesScan = await fetchBinanceKlines(r.symbol, r.interval, 200); r.bollCycleScan = computeBollCycleStats(klinesScan); } catch (e2) { r.bollCycleScan = null; } }
          } catch (e) { r.bollCycle1h = null; r.bollCycleScan = null; }
        }
      }
      await attachBollCycles(final);
      await attachBollCycles(tier2);

      const nearMiss = [...allChecked].filter((r) => r.direction !== "LONG").sort((a, b) => b.score - a.score).slice(0, 3);
      setDayTradeDiag({ poolSize: pool.length, inRangeCount: candidates.length, checkedCount: allChecked.length, longCount: longs.length, breakoutCount: breakouts.length, nearMiss });
      setDayTradeResults(final);
      setDayTradeTier2(tier2);
    } catch (e) { setDayTradeError(e.message || "Lỗi quét danh sách giao dịch trong ngày."); }
    setDayTradeScanning(false);
  }, [watchlist, topVolume, tickers, includeBreakout, rangeMin, rangeMax, minTargetPct]);

  useEffect(() => { if (topVolume.length > 0 && dayTradeResults.length === 0 && !dayTradeScanning) scanDayTrade(); }, [topVolume.length]); // eslint-disable-line

  const scanTop10Boll = useCallback(async () => {
    setTopVolBollScanning(true);
    const top10 = topVolume.slice(0, 10);
    const results = {};
    for (const t of top10) {
      try {
        const klines1h = await fetchBinanceKlines(t.symbol, "1h", 200);
        results[t.symbol] = computeBollCycleStats(klines1h);
      } catch (e) { results[t.symbol] = null; }
    }
    setTopVolBoll(results);
    setTopVolBollScanning(false);
  }, [topVolume]);

  useEffect(() => { if (topVolume.length > 0 && Object.keys(topVolBoll).length === 0 && !topVolBollScanning) scanTop10Boll(); }, [topVolume.length]); // eslint-disable-line

  const runSingleBacktest = useCallback(async (rawSymbol) => {
    const symbol = rawSymbol.toUpperCase().trim().endsWith("USDT") ? rawSymbol.toUpperCase().trim() : rawSymbol.toUpperCase().trim() + "USDT";
    setBtRunning(true); setBtError(null); setBtResult(null);
    try {
      const endTime = Date.now();
      const startTime = endTime - btMonths * 30.44 * 24 * 60 * 60 * 1000;
      const klines = await fetchBinanceKlinesRange(symbol, "4h", startTime, endTime);
      const { trades, spanMonths, error } = runBacktest(klines);
      if (error) throw new Error(error);
      const summary = summarizeTrades(trades);
      setBtResult({ mode: "single", symbol, trades, summary, spanMonths });
    } catch (e) {
      setBtError(e.message || `Không backtest được ${symbol}.`);
    }
    setBtRunning(false);
  }, [btMonths]);

  const runWatchlistBacktest = useCallback(async () => {
    setBtRunning(true); setBtError(null); setBtResult(null);
    try {
      const endTime = Date.now();
      const startTime = endTime - btMonths * 30.44 * 24 * 60 * 60 * 1000;
      const perSymbol = [];
      let allTrades = [];
      for (const sym of watchlist) {
        try {
          const klines = await fetchBinanceKlinesRange(sym, "4h", startTime, endTime);
          const { trades, spanMonths } = runBacktest(klines);
          const summary = summarizeTrades(trades);
          perSymbol.push({ symbol: sym, trades, summary, spanMonths });
          allTrades = allTrades.concat(trades);
        } catch (e) { perSymbol.push({ symbol: sym, error: e.message }); }
      }
      const combinedSummary = summarizeTrades(allTrades);
      const spanMonths = perSymbol.find((p) => p.spanMonths)?.spanMonths || btMonths;
      setBtResult({ mode: "watchlist", perSymbol, trades: allTrades, summary: combinedSummary, spanMonths });
    } catch (e) { setBtError(e.message || "Lỗi backtest danh sách theo dõi."); }
    setBtRunning(false);
  }, [watchlist, btMonths]);

  function addTrade(t) { setTrades((prev) => [{ id: Date.now(), status: "open", ...t }, ...prev]); }
  function closeTrade(id, exitPrice) {
    setTrades((prev) => prev.map((t) => {
      if (t.id !== id) return t;
      const pnl = (exitPrice - t.entry) * t.qty;
      const closedAt = new Date().toISOString();
      const actualHoldMinutes = t.openedAt ? (new Date(closedAt).getTime() - new Date(t.openedAt).getTime()) / 60000 : null;
      return { ...t, status: "closed", exitPrice, pnl, closedAt, actualHoldMinutes };
    }));
  }
  function deleteTrade(id) { setTrades((prev) => prev.filter((t) => t.id !== id)); }
  function addGoalAdjustment(adj) { setGoalAdjustments((prev) => [{ id: Date.now(), ...adj }, ...prev]); }
  function deleteGoalAdjustment(id) { setGoalAdjustments((prev) => prev.filter((a) => a.id !== id)); }
  function pourTradeToGoal(trade) {
    addGoalAdjustment({ amount: trade.pnl, date: trade.closedAt || new Date().toISOString(), note: `Lệnh ${trade.symbol} (${trade.source === "manual" ? "tự quyết định" : "hệ thống"})`, fromTradeId: trade.id });
    setTrades((prev) => prev.map((t) => (t.id === trade.id ? { ...t, pouredToGoal: true } : t)));
  }
  function addGoalMonth(key, targetPct) { setGoalMonths((prev) => (prev.some((m) => m.key === key) ? prev : [...prev, { key, targetPct }].sort((a, b) => a.key.localeCompare(b.key)))); }
  function removeGoalMonth(key) { setGoalMonths((prev) => prev.filter((m) => m.key !== key)); }
  function editGoalMonthPct(key, targetPct) { setGoalMonths((prev) => prev.map((m) => (m.key === key ? { ...m, targetPct } : m))); }

  const realizedPnl = trades.filter((t) => t.status === "closed").reduce((a, t) => a + (t.pnl || 0), 0);
  const currentEquity = capital + realizedPnl;
  const closedTrades = trades.filter((t) => t.status === "closed");
  const wins = closedTrades.filter((t) => t.pnl > 0).length;
  const winRate = closedTrades.length ? Math.round((wins / closedTrades.length) * 100) : null;
  const openRisk = trades.filter((t) => t.status === "open").reduce((a, t) => a + Math.abs((t.entry - t.stop) * t.qty), 0);

  let running = capital;
  const equityCurve = [{ n: 0, equity: capital }].concat([...closedTrades].reverse().map((t, i) => { running += t.pnl; return { n: i + 1, equity: +running.toFixed(2) }; }));

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", color: C.text, minHeight: "100vh" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 20, overflow: "hidden", whiteSpace: "nowrap", background: C.amberDim, borderBottom: `1px solid ${C.amber}`, padding: "8px 0" }}>
        <div className="tt-marquee-track">
          {[0, 1].map((i) => (
            <span key={i} style={{ padding: "0 2.5rem", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, fontWeight: 700, color: C.amber, textShadow: "0 0 10px rgba(242,184,75,0.5)" }}>
              ⚠ Thà không có thêm lợi nhuận còn hơn âm những gì đang có
            </span>
          ))}
        </div>
      </div>
      <div style={{ borderBottom: `1px solid ${C.border}`, padding: "16px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: `linear-gradient(135deg, ${C.blue}, ${C.bull})`, boxShadow: `0 0 14px rgba(91,141,239,0.45)`, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="activity" size={16} color="#04101a" />
          </div>
          <div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 17, lineHeight: 1, display: "flex", alignItems: "center", gap: 8 }}>
              <span className="tt-gradient-text">Spot Terminal</span> <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: C.blue, background: C.blueDim, padding: "2px 7px", borderRadius: 5 }}>{VERSION}</span>
            </div>
            <div style={{ fontSize: 11, color: C.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>giao dịch spot ngắn hạn · không phải lời khuyên đầu tư</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: C.textFaint }}>{lastUpdate ? `Cập nhật: ${lastUpdate.toLocaleTimeString("vi-VN")}` : "Đang tải..."}</div>
          <button onClick={loadMarket} className="tt-btn" style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "7px 10px", color: C.text, display: "flex" }}>
            <span className={loading ? "spin" : ""} style={{ display: "flex" }}><Icon name="refresh" size={13} /></span>
          </button>
        </div>
      </div>

      {!isStandalone && !installDismissed && (
        <div style={{ background: C.blueDim, borderBottom: `1px solid ${C.border}`, padding: "10px 28px", fontSize: 13, color: C.blue, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <Icon name="info" size={15} />
          <div style={{ flex: 1, minWidth: 200 }}>Cài ứng dụng lên màn hình chính — mở nhanh hơn, không cần vào lại link mỗi lần.</div>
          <button className="tt-btn" onClick={triggerInstall} style={{ background: C.blue, border: "none", borderRadius: 6, padding: "6px 12px", color: "#04101a", fontWeight: 600, fontSize: 12 }}>Cài đặt</button>
          <button className="tt-btn" onClick={() => setInstallDismissed(true)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px", color: C.textDim, fontSize: 12 }}>Ẩn</button>
        </div>
      )}
      {showIOSHelp && (
        <div style={{ background: C.surface2, borderBottom: `1px solid ${C.border}`, padding: "10px 28px", fontSize: 13, color: C.textDim, display: "flex", gap: 10, alignItems: "flex-start", flexWrap: "wrap" }}>
          <Icon name="info" size={15} color={C.textFaint} />
          <div style={{ flex: 1, minWidth: 200 }}>
            <b style={{ color: C.text }}>iPhone/iPad (Safari):</b> bấm nút Chia sẻ (hình vuông có mũi tên) ở thanh dưới → chọn "Thêm vào Màn hình chính".<br />
            <b style={{ color: C.text }}>Android (Chrome):</b> bấm menu 3 chấm ở góc trên phải → chọn "Cài đặt ứng dụng" hoặc "Thêm vào Màn hình chính".
          </div>
          <button className="tt-btn" onClick={() => setShowIOSHelp(false)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px", color: C.textDim, fontSize: 12 }}>Đã hiểu</button>
        </div>
      )}
      {ghPendingRemote && (
        <div style={{ background: C.blueDim, borderBottom: `1px solid ${C.blue}`, padding: "10px 28px", fontSize: 13, color: C.blue, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <Icon name="refresh" size={15} />
          <div style={{ flex: 1, minWidth: 200 }}><b>Phát hiện dữ liệu mới hơn từ thiết bị khác</b> (cập nhật lúc {new Date(ghPendingRemote.lastModified).toLocaleString("vi-VN")}) — áp dụng để đồng bộ?</div>
          <button className="tt-btn" onClick={applyPendingRemote} style={{ background: C.blue, border: "none", borderRadius: 6, padding: "6px 14px", color: "#04101a", fontWeight: 700, fontSize: 12 }}>Áp dụng</button>
          <button className="tt-btn" onClick={dismissPendingRemote} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 12px", color: C.textDim, fontSize: 12 }}>Bỏ qua</button>
        </div>
      )}
      {updateInfo && (
        <div style={{ background: C.amberDim, borderBottom: `1px solid ${C.amber}`, padding: "10px 28px", fontSize: 13, color: C.amber, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <Icon name="alert" size={15} />
          <div><b>Có bản cập nhật mới: {updateInfo.version}.</b> {updateInfo.notes || ""} Hãy tải file mới nhất và host đè lên bản hiện tại để dùng phiên bản mới nhất.</div>
        </div>
      )}
      {persistMode === "local" && (
        <div style={{ background: C.bullDim, borderBottom: `1px solid ${C.border}`, padding: "10px 28px", fontSize: 13, color: C.bull, display: "flex", gap: 10, alignItems: "center" }}>
          <Icon name="info" size={15} /> Vốn/lệnh đang được lưu tự động trên trình duyệt này (localStorage) — sẽ còn nguyên khi tải lại trang. Lưu ý: dữ liệu gắn với đúng trình duyệt + đúng file này trên máy này; đổi trình duyệt, xóa dữ liệu duyệt web, hoặc chuyển sang máy khác sẽ không thấy lại dữ liệu cũ.
        </div>
      )}
      {persistMode === "none" && (
        <div style={{ background: C.blueDim, borderBottom: `1px solid ${C.border}`, padding: "10px 28px", fontSize: 13, color: C.blue, display: "flex", gap: 10, alignItems: "center" }}>
          <Icon name="info" size={15} /> Trình duyệt này chặn lưu trữ cục bộ (có thể do chế độ ẩn danh) nên vốn/lệnh sẽ KHÔNG tự lưu — mất khi tải lại trang.
        </div>
      )}
      {fetchError && (
        <div style={{ background: C.amberDim, borderBottom: `1px solid ${C.border}`, padding: "10px 28px", display: "flex", alignItems: "center", gap: 10, fontSize: 13, color: C.amber }}>
          <Icon name="alert" size={15} />
          <span>Không lấy được dữ liệu thật từ Binance ({fetchError}). Kiểm tra kết nối mạng hoặc thử "Tải lại".</span>
        </div>
      )}

      <div style={{ display: "flex", gap: 4, padding: "0 28px", borderBottom: `1px solid ${C.border}`, overflowX: "auto" }}>
        {[{ id: "overview", label: "Tổng quan" }, { id: "action", label: "Kế hoạch hành động" }, { id: "backtest", label: "Backtest & Dự phóng" }, { id: "portfolio", label: "Báo cáo & Nguồn vốn" }, { id: "goals", label: "Mục tiêu" }].map((t) => (
          <div key={t.id} onClick={() => setTab(t.id)} className="tt-tab" style={{ padding: "14px 6px", marginRight: 26, fontSize: 14, fontWeight: 600, color: tab === t.id ? C.text : C.textFaint, textShadow: tab === t.id ? `0 0 12px rgba(91,141,239,0.5)` : "none", borderBottom: tab === t.id ? `2px solid ${C.blue}` : "2px solid transparent", boxShadow: tab === t.id ? `0 2px 8px -2px rgba(91,141,239,0.6)` : "none" }}>
            {t.label}
          </div>
        ))}
      </div>

      <div style={{ padding: 28, maxWidth: 1180, margin: "0 auto" }}>
        {tab === "overview" && <OverviewTab tickers={tickers} watchlist={watchlist} setWatchlist={setWatchlist} topVolume={topVolume} topVolBoll={topVolBoll} topVolBollScanning={topVolBollScanning} scanTop10Boll={scanTop10Boll} fng={fng} globalData={globalData} scanResults={scanResults} setTab={setTab} setCoinInput={setCoinInput} runAnalysis={runAnalysis} dayTradeResults={dayTradeResults} dayTradeTier2={dayTradeTier2} dayTradeScanning={dayTradeScanning} dayTradeError={dayTradeError} dayTradeDiag={dayTradeDiag} includeBreakout={includeBreakout} setIncludeBreakout={setIncludeBreakout} rangeMin={rangeMin} setRangeMin={setRangeMin} rangeMax={rangeMax} setRangeMax={setRangeMax} minTargetPct={minTargetPct} setMinTargetPct={setMinTargetPct} scanInterval={scanInterval} setScanInterval={setScanInterval} plannedCapital={plannedCapital} setPlannedCapital={setPlannedCapital} scanDayTrade={scanDayTrade} />}
        {tab === "action" && <ActionPlanTab coinInput={coinInput} setCoinInput={setCoinInput} runAnalysis={runAnalysis} analyzing={analyzing} analysis={analysis} analyzeError={analyzeError} scanResults={scanResults} capital={currentEquity} riskPct={riskPct} setRiskPct={setRiskPct} addTrade={addTrade} dayTradeResults={dayTradeResults} dayTradeTier2={dayTradeTier2} dayTradeScanning={dayTradeScanning} dayTradeError={dayTradeError} dayTradeDiag={dayTradeDiag} includeBreakout={includeBreakout} setIncludeBreakout={setIncludeBreakout} rangeMin={rangeMin} setRangeMin={setRangeMin} rangeMax={rangeMax} setRangeMax={setRangeMax} minTargetPct={minTargetPct} setMinTargetPct={setMinTargetPct} scanInterval={scanInterval} setScanInterval={setScanInterval} plannedCapital={plannedCapital} setPlannedCapital={setPlannedCapital} scanDayTrade={scanDayTrade} />}
        {tab === "backtest" && <BacktestTab btSymbol={btSymbol} setBtSymbol={setBtSymbol} btMonths={btMonths} setBtMonths={setBtMonths} btRunning={btRunning} btError={btError} btResult={btResult} runSingleBacktest={runSingleBacktest} runWatchlistBacktest={runWatchlistBacktest} currentEquity={currentEquity} />}
        {tab === "portfolio" && <PortfolioTab capital={capital} setCapital={setCapital} trades={trades} closeTrade={closeTrade} deleteTrade={deleteTrade} currentEquity={currentEquity} winRate={winRate} openRisk={openRisk} equityCurve={equityCurve} realizedPnl={realizedPnl} tickers={tickers} exportBackup={exportBackup} importBackup={importBackup} persistMode={persistMode} ghToken={ghToken} ghGistId={ghGistId} ghSyncStatus={ghSyncStatus} ghSyncMessage={ghSyncMessage} ghLastSynced={ghLastSynced} initGistSync={initGistSync} linkExistingGist={linkExistingGist} syncNow={syncNow} disconnectSync={disconnectSync} pourTradeToGoal={pourTradeToGoal} setTab={setTab} />}
        {tab === "goals" && <GoalsTab capital={capital} setCapital={setCapital} currentEquity={currentEquity} trades={trades} goalBigTarget={goalBigTarget} setGoalBigTarget={setGoalBigTarget} goalMonthlyPct={goalMonthlyPct} setGoalMonthlyPct={setGoalMonthlyPct} goalAdjustments={goalAdjustments} addGoalAdjustment={addGoalAdjustment} deleteGoalAdjustment={deleteGoalAdjustment} goalMonths={goalMonths} addGoalMonth={addGoalMonth} removeGoalMonth={removeGoalMonth} editGoalMonthPct={editGoalMonthPct} />}
      </div>
      <div style={{ textAlign: "center", padding: "18px", fontSize: 11, color: C.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>Spot Terminal {VERSION} · dữ liệu từ Binance / CoinGecko / Alternative.me</div>

      <button className="tt-btn" onClick={() => setQuickChatOpen((v) => !v)} title="Tra cứu nhanh"
        style={{ position: "fixed", bottom: 20, right: 20, zIndex: 30, width: 52, height: 52, borderRadius: "50%", background: `linear-gradient(135deg, ${C.blue}, ${C.bull})`, boxShadow: "0 0 18px rgba(91,141,239,0.5)", border: "none", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon name={quickChatOpen ? "x" : "search"} size={22} color="#04101a" />
      </button>

      {quickChatOpen && (
        <div style={{ position: "fixed", bottom: 82, right: 20, zIndex: 30, width: 340, maxWidth: "calc(100vw - 32px)", maxHeight: "60vh", display: "flex", flexDirection: "column", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, boxShadow: "0 0 0 1px rgba(91,141,239,0.08), 0 12px 40px rgba(0,0,0,0.5)", overflow: "hidden" }}>
          <div style={{ padding: "12px 14px", borderBottom: `1px solid ${C.border}`, background: C.surface2 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5 }}>Tra cứu nhanh</div>
            <div style={{ fontSize: 11, color: C.textFaint, marginTop: 2 }}>Nhận diện theo mẫu câu cố định — không phải AI hiểu tự do. Nguồn: Binance, OKX.</div>
          </div>
          <div style={{ flex: 1, overflowY: "auto", padding: 12, display: "flex", flexDirection: "column", gap: 10, minHeight: 120 }}>
            {quickChatMessages.length === 0 && (
              <div style={{ fontSize: 12, color: C.textFaint, lineHeight: 1.6 }}>
                Ví dụ bạn có thể hỏi:<br />
                • "Khối lượng của BTC trên Binance"<br />
                • "Giá ETH trên OKX"<br />
                • "Top 10 coin tăng giá nhanh nhất 24h trên Binance"<br />
                • "Danh sách coin giảm giá nhiều nhất trên OKX"
              </div>
            )}
            {quickChatMessages.map((m, i) => (
              <div key={i} style={{ alignSelf: m.role === "user" ? "flex-end" : "flex-start", maxWidth: "88%", background: m.role === "user" ? C.blueDim : C.surface2, color: m.role === "user" ? C.blue : C.text, borderRadius: 10, padding: "8px 11px", fontSize: 12.5, whiteSpace: "pre-line", lineHeight: 1.5 }}>{m.text}</div>
            ))}
            {quickChatLoading && <div style={{ fontSize: 12, color: C.textFaint }}>Đang tra cứu...</div>}
          </div>
          <div style={{ display: "flex", gap: 6, padding: 10, borderTop: `1px solid ${C.border}` }}>
            <input value={quickChatInput} onChange={(e) => setQuickChatInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleQuickAsk()} placeholder="Nhập câu hỏi..." style={{ flex: 1, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 10px", color: C.text, fontSize: 12.5 }} />
            <button className="tt-btn" onClick={handleQuickAsk} disabled={quickChatLoading || !quickChatInput.trim()} style={{ background: C.blue, opacity: (quickChatLoading || !quickChatInput.trim()) ? 0.4 : 1, border: "none", borderRadius: 8, padding: "8px 14px", color: "#04101a", fontWeight: 700, fontSize: 12.5 }}>Hỏi</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* v1.13: card gợi ý giao dịch trong ngày — DÙNG CHUNG cho cả tab Tổng quan và tab Kế hoạch hành động,
   để không còn tình trạng 2 tab hiện 2 danh sách khác nhau. Bấm "Phân tích" luôn khóa khung 15m —
   đúng khung đã dùng để lọc coin này vào danh sách, đảm bảo số liệu không bị lệch khi xem chi tiết. */
function DayTradeCard({ results, tier2, scanning, error, scanDayTrade, setCoinInput, setTab, runAnalysis, onOverviewTab, diag, includeBreakout, setIncludeBreakout, rangeMin, setRangeMin, rangeMax, setRangeMax, minTargetPct, setMinTargetPct, scanInterval, setScanInterval, plannedCapital, setPlannedCapital }) {
  function renderRow(t, idx, muted) {
    const hasPlan = (t.direction === "LONG" || t.direction === "TRUNG LẬP") && t.pctTarget != null && t.pctStop != null;
    const expectedProfit = hasPlan ? plannedCapital * (t.pctTarget / 100) : null;
    const expectedLoss = hasPlan ? plannedCapital * (t.pctStop / 100) : null; // pctStop đã âm sẵn
    return (
      <div key={t.symbol} className="tt-row" style={{ display: "flex", flexDirection: "column", gap: 8, padding: "12px 14px", borderRadius: 10, border: `1px solid ${muted ? C.amber + "55" : C.border}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
            <span style={{ width: 14, color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", fontSize: 12 }}>{idx + 1}</span>
            <b style={{ fontSize: 15 }}>{t.symbol.replace("USDT", "")}</b>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, color: C.textDim }}>{usd(t.lastPrice)}</span>
          </div>
          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
            <Pill tone="blue">Khung {t.interval}</Pill>
            <Pill tone={t.direction === "LONG" ? "bull" : muted ? "amber" : "amber"}>{muted ? "KHÁ" : t.direction} · {t.confidence}%</Pill>
          </div>
        </div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 11.5, color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", paddingLeft: 24 }}>
          <span>Biên độ 24h {t.rangePct.toFixed(1)}%</span>
          <span>Vol {usd(t.quoteVolume / 1e6)}M</span>
          <span>⏱ {formatDuration(t.estHoldMinutes)}</span>
        </div>
        {hasPlan ? (
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 12.5, fontFamily: "'JetBrains Mono', monospace", paddingLeft: 24 }}>
            <span>Vốn {usd(plannedCapital)}</span>
            <span style={{ color: C.bull }}>Nếu đúng kịch bản: +{usd(expectedProfit)} ({t.pctTarget > 0 ? "+" : ""}{t.pctTarget}%)</span>
            <span style={{ color: C.bear }}>Nếu chạm stop: {usd(expectedLoss)} ({t.pctStop}%)</span>
          </div>
        ) : (
          <div style={{ fontSize: 12, color: C.textFaint, paddingLeft: 24 }}>BREAKOUT NÓNG chưa có entry/target cụ thể — không tính được lời/lỗ dự kiến.</div>
        )}
        <div style={{ fontSize: 11.5, color: C.textFaint, paddingLeft: 24, display: "flex", flexDirection: "column", gap: 2 }}>
          <span>Chu kỳ BOLL 1H cố định (TB 7 ngày): {t.bollCycle1h === undefined ? "đang tính..." : t.bollCycle1h ? `~${formatDuration(t.bollCycle1h.avgMinutes)} từ LB→UB (${t.bollCycle1h.count} chu kỳ)` : "chưa có chu kỳ hoàn chỉnh trong 7 ngày qua"}</span>
          {t.interval !== "1h" && (
            <span>Chu kỳ BOLL khung {t.interval} (khung đã kích hoạt tín hiệu này, TB 7 ngày): {t.bollCycleScan === undefined ? "đang tính..." : t.bollCycleScan ? `~${formatDuration(t.bollCycleScan.avgMinutes)} từ LB→UB (${t.bollCycleScan.count} chu kỳ)` : "chưa có chu kỳ hoàn chỉnh trong 7 ngày qua"}</span>
          )}
        </div>
        <button className="tt-btn" onClick={() => { setCoinInput(t.symbol.replace("USDT", "")); if (onOverviewTab) setTab("action"); runAnalysis(t.symbol.replace("USDT", ""), t.interval); }}
          style={{ marginTop: 2, width: "100%", background: "transparent", border: `1px solid ${muted ? C.amber : C.border}`, borderRadius: 8, color: muted ? C.amber : C.blue, fontSize: 13, fontWeight: 600, padding: "9px 10px" }}>Phân tích →</button>
      </div>
    );
  }
  return (
    <Card>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
        <SectionLabel>Gợi ý giao dịch — quét đồng thời 15m/1h/4h, biên độ {rangeMin}-{rangeMax}%, target ≥{minTargetPct}%, thanh khoản cao</SectionLabel>
        <button className="tt-btn" onClick={scanDayTrade} disabled={scanning} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, color: C.textDim, fontSize: 12, padding: "4px 10px", display: "flex", alignItems: "center", gap: 6 }}>
          <span className={scanning ? "spin" : ""} style={{ display: "flex" }}><Icon name="refresh" size={12} /></span> Quét lại
        </button>
      </div>
      <div style={{ fontSize: 12.5, color: C.textFaint, marginBottom: 10, lineHeight: 1.5 }}>
        Mỗi coin được kiểm tra trên CẢ 3 khung (15 phút, 1 giờ, 4 giờ) — chỉ cần đạt <b style={{ color: C.bull }}>LONG</b> ở 1 trong 3 khung là hiện ra, lấy khung có điểm cao nhất làm đại diện (nhãn "Khung..." trên mỗi dòng cho biết khung nào đã kích hoạt). Chỉ hiện coin có target đạt tối thiểu {minTargetPct}% (bạn chỉnh được bên dưới). Biên độ tính từ dao động cao/thấp <b>thật</b> trong 24h qua. Nguồn: watchlist của bạn + nhóm coin khối lượng lớn trên Binance. Danh sách này giống hệt nhau ở cả 2 tab.
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, color: C.textFaint }}>Khung mặc định khi bấm "Phân tích →"</span>
        <select value={scanInterval} onChange={(e) => setScanInterval(e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px", color: C.text, fontSize: 13 }}>
          {BINANCE_INTERVALS.map((i) => <option key={i.value} value={i.value}>{i.label} ({i.value})</option>)}
        </select>
        <span style={{ fontSize: 11.5, color: C.textFaint }}>(danh sách gợi ý bên dưới luôn quét cả 15m/1h/4h, không phụ thuộc lựa chọn này)</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, color: C.textFaint }}>Vốn dự kiến vào mỗi lệnh</span>
        <span style={{ fontSize: 12, color: C.textFaint }}>$</span>
        <input type="number" value={plannedCapital} min="0" step="10" onChange={(e) => setPlannedCapital(+e.target.value)} style={{ width: 100, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "5px 8px", color: C.text, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }} />
        <span style={{ fontSize: 12, color: C.textFaint }}>· tự tính lời/lỗ dự kiến ngay, không cần quét lại</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, color: C.textFaint }}>Biên độ 24h từ</span>
        <input type="number" value={rangeMin} min="0" max={rangeMax} step="0.5" onChange={(e) => setRangeMin(+e.target.value)} style={{ width: 60, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "5px 8px", color: C.text, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }} />
        <span style={{ fontSize: 12, color: C.textFaint }}>% đến</span>
        <input type="number" value={rangeMax} min={rangeMin} step="0.5" onChange={(e) => setRangeMax(+e.target.value)} style={{ width: 60, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "5px 8px", color: C.text, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }} />
        <span style={{ fontSize: 12, color: C.textFaint }}>%</span>
        <span style={{ fontSize: 12, color: C.textFaint, marginLeft: 8 }}>Target tối thiểu</span>
        <input type="number" value={minTargetPct} min="0" step="0.5" onChange={(e) => setMinTargetPct(+e.target.value)} style={{ width: 60, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "5px 8px", color: C.text, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }} />
        <span style={{ fontSize: 12, color: C.textFaint }}>% · chỉnh xong bấm "Quét lại" để áp dụng ngay</span>
      </div>
      <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, fontSize: 12.5, color: C.textDim, cursor: "pointer" }}>
        <input type="checkbox" checked={includeBreakout} onChange={(e) => setIncludeBreakout(e.target.checked)} />
        Hiện cả <span style={{ color: C.amber }}>BREAKOUT NÓNG</span> (xu hướng/volume mạnh nhưng quá mua — rủi ro cao hơn, tự chịu trách nhiệm nếu vào lệnh)
      </label>
      {error && <div style={{ fontSize: 13, color: C.bear, marginBottom: 10 }}>{error}</div>}
      {scanning && results.length === 0 && tier2.length === 0 ? (
        <div style={{ color: C.textFaint, fontSize: 13 }}>Đang quét cả 3 khung cho từng coin (có thể mất 30-90 giây tùy số coin đạt biên độ)...</div>
      ) : results.length === 0 && tier2.length === 0 ? (
        <div>
          <div style={{ color: C.textFaint, fontSize: 13, marginBottom: diag ? 10 : 0 }}>Hiện không có coin nào vừa đạt biên độ {rangeMin}-{rangeMax}% vừa có tín hiệu LONG (ở bất kỳ khung nào trong 15m/1h/4h) vừa đạt target ≥{minTargetPct}% lúc này. Bấm "Quét lại" để kiểm tra lại.</div>
          {diag && (
            <div style={{ background: C.surface2, borderRadius: 8, padding: 12, fontSize: 12.5, color: C.textDim, lineHeight: 1.7 }}>
              <div><b style={{ color: C.text }}>Vì sao trống — chẩn đoán bộ lọc:</b></div>
              <div>• Tổng nguồn ứng viên (watchlist + khối lượng lớn): <b>{diag.poolSize}</b> coin</div>
              <div>• Đạt biên độ 24h {rangeMin}-{rangeMax}%: <b>{diag.inRangeCount}</b> coin</div>
              <div>• Đã kiểm tra tín hiệu (khung tốt nhất trong 15m/1h/4h): <b>{diag.checkedCount}</b> coin</div>
              <div>• Đạt LONG + target ≥{minTargetPct}%: <b style={{ color: diag.longCount > 0 ? C.bull : C.text }}>{diag.longCount}</b> · Đạt BREAKOUT NÓNG: <b style={{ color: C.amber }}>{diag.breakoutCount}</b></div>
              {diag.nearMiss && diag.nearMiss.length > 0 && (
                <div style={{ marginTop: 8 }}>
                  <div style={{ color: C.text }}>Gần đạt nhất (chưa đủ điểm LONG):</div>
                  {diag.nearMiss.map((n) => (
                    <div key={n.symbol} style={{ marginLeft: 8 }}>– {n.symbol.replace("USDT", "")}: điểm {n.score.toFixed(1)} ({n.direction})</div>
                  ))}
                </div>
              )}
              <div style={{ marginTop: 8, fontStyle: "italic" }}>Đây là đánh đổi có chủ đích giữa số lượng và chất lượng tín hiệu, không phải lỗi — đã quét cả 3 khung để tối đa cơ hội mà không hạ chuẩn điểm số.</div>
            </div>
          )}
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {results.map((t, idx) => renderRow(t, idx, false))}
          {results.length > 0 && <div style={{ fontSize: 11.5, color: C.textFaint, marginTop: 2 }}>⏱ Thời gian giữ lệnh dự kiến = ước tính thống kê dựa trên biến động trung bình mỗi nến (ATR) đến khi chạm target. Lời/lỗ dự kiến tính theo đúng % target/stop của tín hiệu — cả hai đều là ước tính dựa trên kịch bản, KHÔNG phải cam kết.</div>}

          {tier2.length > 0 && (
            <div style={{ marginTop: 10, paddingTop: 14, borderTop: `1px dashed ${C.borderLight}` }}>
              <div style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 10 }}>
                <Icon name="alert" size={14} color={C.amber} />
                <div style={{ fontSize: 12.5, color: C.textDim, lineHeight: 1.6 }}>
                  <b style={{ color: C.amber }}>Tín hiệu KHÁ — độ tin cậy thấp hơn LONG, chưa đạt ngưỡng 3.5/7.</b> Vẫn đạt target tối thiểu {minTargetPct}% nếu đúng kịch bản, nhưng ít tín hiệu đồng thuận hơn. Hoàn toàn do bạn quyết định có chấp nhận rủi ro cao hơn để có thêm cơ hội giao dịch hay không.
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {tier2.map((t, idx) => renderRow(t, idx, true))}
              </div>
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

function OverviewTab({ tickers, watchlist, setWatchlist, topVolume, topVolBoll, topVolBollScanning, scanTop10Boll, fng, globalData, scanResults, setTab, setCoinInput, runAnalysis, dayTradeResults, dayTradeTier2, dayTradeScanning, dayTradeError, dayTradeDiag, includeBreakout, setIncludeBreakout, rangeMin, setRangeMin, rangeMax, setRangeMax, minTargetPct, setMinTargetPct, scanInterval, setScanInterval, plannedCapital, setPlannedCapital, scanDayTrade }) {
  const fngVal = fng ? +fng.value : null;
  const fngTone = fngVal == null ? "neutral" : fngVal < 25 ? "bear" : fngVal < 45 ? "amber" : fngVal < 55 ? "neutral" : fngVal < 75 ? "bull" : "amber";
  const btcDom = globalData?.market_cap_percentage?.btc;
  const mcapChange = globalData?.market_cap_change_percentage_24h_usd;
  const topVolSet = new Set(topVolume.map((t) => t.symbol));
  const [addInput, setAddInput] = useState("");
  function addToWatchlist(sym) { if (!watchlist.includes(sym)) setWatchlist([...watchlist, sym]); }
  function removeFromWatchlist(sym) { setWatchlist(watchlist.filter((s) => s !== sym)); }
  function submitAddInput() {
    const raw = addInput.toUpperCase().trim();
    if (!raw) return;
    const sym = raw.endsWith("USDT") ? raw : raw + "USDT";
    addToWatchlist(sym);
    setAddInput("");
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px,1fr))", gap: 14 }}>
        <Card><SectionLabel>Fear & Greed Index</SectionLabel>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 32, fontWeight: 700 }}>{fngVal ?? "—"}</div>
            <Pill tone={fngTone}>{fng?.value_classification || "đang tải"}</Pill>
          </div>
        </Card>
        <Card><SectionLabel>BTC Dominance</SectionLabel>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 32, fontWeight: 700 }}>{btcDom ? btcDom.toFixed(1) + "%" : "—"}</div>
        </Card>
        <Card><SectionLabel>Vốn hóa toàn thị trường 24h</SectionLabel>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 32, fontWeight: 700, color: mcapChange > 0 ? C.bull : C.bear }}>{mcapChange != null ? (mcapChange > 0 ? "+" : "") + mcapChange.toFixed(2) + "%" : "—"}</div>
            {mcapChange > 0 ? <Icon name="up" size={20} color={C.bull} /> : <Icon name="down" size={20} color={C.bear} />}
          </div>
        </Card>
      </div>

      <Card>
        <SectionLabel>Bản tin đầu ngày (vĩ mô)</SectionLabel>
        <div style={{ fontSize: 13.5, color: C.textDim, lineHeight: 1.6 }}>
          Phần này cần tin tức/lịch kinh tế realtime (CPI, FOMC, DXY...) mà không có API CORS miễn phí đáng tin cậy để gọi trực tiếp từ trình duyệt.
          Cách dùng thực tế: mỗi sáng, nhắn Claude "cập nhật tin vĩ mô hôm nay" trong chat trước khi mở phiên giao dịch.
        </div>
      </Card>

      <Card>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
          <SectionLabel>Top 10 coin khối lượng giao dịch lớn nhất (Binance, 24h)</SectionLabel>
          <button className="tt-btn" onClick={scanTop10Boll} disabled={topVolBollScanning} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, color: C.textDim, fontSize: 12, padding: "4px 10px", display: "flex", alignItems: "center", gap: 6 }}>

                      <button className="tt-btn" onClick={() => addToWatchlist(t.symbol)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, color: C.blue, fontSize: 12, padding: "4px 8px" }}>+ Theo dõi</button>
                    )}
                  </div>
                </div>
                <div style={{ fontSize: 11.5, color: C.textFaint, paddingLeft: 30 }}>
                  {topVolBollScanning && boll === undefined ? "Đang quét chu kỳ BOLL..." : boll ? `Chu kỳ BOLL (1H, TB 7 ngày): ~${formatDuration(boll.avgMinutes)} (${boll.count} chu kỳ)` : "Chu kỳ BOLL: chưa có chu kỳ LB→UB hoàn chỉnh nào trong 7 ngày qua"}
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      <DayTradeCard results={dayTradeResults} tier2={dayTradeTier2} scanning={dayTradeScanning} error={dayTradeError} diag={dayTradeDiag} includeBreakout={includeBreakout} setIncludeBreakout={setIncludeBreakout} rangeMin={rangeMin} setRangeMin={setRangeMin} rangeMax={rangeMax} setRangeMax={setRangeMax} minTargetPct={minTargetPct} setMinTargetPct={setMinTargetPct} scanInterval={scanInterval} setScanInterval={setScanInterval} plannedCapital={plannedCapital} setPlannedCapital={setPlannedCapital} scanDayTrade={scanDayTrade} setCoinInput={setCoinInput} setTab={setTab} runAnalysis={runAnalysis} onOverviewTab={true} />

      <Card>
        <SectionLabel>Danh sách theo dõi</SectionLabel>
        <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
          <input value={addInput} onChange={(e) => setAddInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submitAddInput(); }}
            placeholder="Thêm coin vào theo dõi (vd SUI, DOGE...)"
            style={{ flex: "1 1 220px", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 12px", color: C.text, fontSize: 13 }} />

          </button>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr style={{ color: C.textFaint, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, textTransform: "uppercase" }}>
              <td style={{ padding: "6px 8px" }}>Coin</td><td style={{ padding: "6px 8px" }}>Giá</td><td style={{ padding: "6px 8px" }}>24h %</td><td style={{ padding: "6px 8px" }}>Volume 24h</td><td style={{ padding: "6px 8px" }}>Tín hiệu (4h)</td><td style={{ padding: "6px 8px" }}></td><td style={{ padding: "6px 8px" }}></td>
            </tr></thead>
            <tbody>
              {watchlist.map((sym) => {
                const t = tickers[sym]; const chg = t ? +t.priceChangePercent : null;
                const scan = scanResults.find((s) => s.symbol === sym);
                return (
                  <tr key={sym} className="tt-row" style={{ borderTop: `1px solid ${C.border}` }}>
                    <td style={{ padding: "10px 8px", fontWeight: 600 }}>
