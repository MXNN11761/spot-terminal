                    </td>
                    <td style={{ padding: "10px 8px", fontFamily: "'JetBrains Mono', monospace" }}>{t ? usd(+t.lastPrice) : "—"}</td>
                    <td style={{ padding: "10px 8px", fontFamily: "'JetBrains Mono', monospace", color: chg > 0 ? C.bull : chg < 0 ? C.bear : C.textDim }}>{chg != null ? (chg > 0 ? "+" : "") + chg.toFixed(2) + "%" : "—"}</td>
                    <td style={{ padding: "10px 8px", fontFamily: "'JetBrains Mono', monospace", color: C.textDim }}>{t ? usd(+t.quoteVolume / 1e6) + "M" : "—"}</td>
                    <td style={{ padding: "10px 8px" }}>{scan ? <Pill tone={scan.direction === "LONG" ? "bull" : scan.direction.includes("TRÁNH") ? "bear" : scan.direction.includes("NÓNG") ? "amber" : "neutral"}>{scan.direction} · {scan.confidence}%</Pill> : <span style={{ color: C.textFaint }}>—</span>}</td>
                    <td style={{ padding: "10px 8px" }}>
                      <button className="tt-btn" onClick={() => { setCoinInput(sym.replace("USDT", "")); setTab("action"); runAnalysis(sym.replace("USDT", ""), scanInterval); }} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, color: C.blue, fontSize: 12, padding: "4px 8px" }}>Phân tích →</button>
                    </td>
                    <td style={{ padding: "10px 8px" }}>
                      <button className="tt-btn" onClick={() => removeFromWatchlist(sym)} title="Xóa khỏi danh sách theo dõi" style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "5px 8px" }}>
                        <Icon name="trash" size={13} color={C.textFaint} />
                      </button>
                    </td>
                  </tr>
                );
              })}
              {watchlist.length === 0 && (
                <tr><td colSpan="7" style={{ padding: "14px 8px", color: C.textFaint, fontSize: 13 }}>Danh sách theo dõi đang trống — thêm coin ở ô phía trên.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function ActionPlanTab({ coinInput, setCoinInput, runAnalysis, analyzing, analysis, analyzeError, scanResults, capital, riskPct, setRiskPct, addTrade, dayTradeResults, dayTradeTier2, dayTradeScanning, dayTradeError, dayTradeDiag, includeBreakout, setIncludeBreakout, rangeMin, setRangeMin, rangeMax, setRangeMax, minTargetPct, setMinTargetPct, scanInterval, setScanInterval, plannedCapital, setPlannedCapital, scanDayTrade }) {
  const [showMethod, setShowMethod] = useState(false);
  const [manualOpen, setManualOpen] = useState(false);
  const [manualEntry, setManualEntry] = useState("");
  const [manualStop, setManualStop] = useState("");
  const [manualTarget, setManualTarget] = useState("");
  const suggestedRisk$ = capital * (riskPct / 100);
  let qty = 0, positionValue = 0, riskAmount = 0, riskPctOfCapital = 0, riskExceeds = false;
  if (analysis && (analysis.direction === "LONG" || analysis.direction === "TRUNG LẬP")) {
    const capped = Math.min(Math.max(plannedCapital, 0), capital);
    qty = analysis.entry > 0 ? capped / analysis.entry : 0;
    positionValue = capped;
    riskAmount = qty * Math.abs(analysis.entry - analysis.stop);
    riskPctOfCapital = capital > 0 ? (riskAmount / capital) * 100 : 0;
    riskExceeds = riskPctOfCapital > riskPct;
  }

  const mEntry = +manualEntry || 0, mStop = +manualStop || 0, mTarget = +manualTarget || 0;
  const manualValid = mEntry > 0 && mStop > 0 && mStop < mEntry;
  const manualRiskPerUnit = manualValid ? mEntry - mStop : 0;
  let manualQtyFinal = 0, manualValueFinal = 0, manualRiskAmount = 0, manualRiskPctOfCapital = 0, manualRiskExceeds = false;
  if (manualValid) {
    const manualCapped = Math.min(Math.max(plannedCapital, 0), capital);
    manualQtyFinal = mEntry > 0 ? manualCapped / mEntry : 0;
    manualValueFinal = manualCapped;
    manualRiskAmount = manualQtyFinal * manualRiskPerUnit;
    manualRiskPctOfCapital = capital > 0 ? (manualRiskAmount / capital) * 100 : 0;
    manualRiskExceeds = manualRiskPctOfCapital > riskPct;
  }
  const manualRR = manualValid && mTarget > mEntry ? +((mTarget - mEntry) / manualRiskPerUnit).toFixed(2) : null;

  function resetManualForm() { setManualOpen(false); setManualEntry(""); setManualStop(""); setManualTarget(""); }
  function submitManualTrade() {
    if (!analysis || !manualValid) return;
    const manualEstHoldMinutes = mTarget > mEntry && analysis.curAtr > 0 ? Math.max(1, Math.ceil((mTarget - mEntry) / analysis.curAtr)) * (INTERVAL_MINUTES[analysis.interval] || 15) : null;
    addTrade({
      symbol: analysis.symbol.replace("USDT", ""), direction: "LONG", entry: mEntry, stop: mStop, target: mTarget || null,
      qty: manualQtyFinal, openedAt: new Date().toISOString(),
      source: "manual", signalAtEntry: analysis.direction, confidenceAtEntry: analysis.confidence, rsiAtEntry: analysis.curRsi,
      estHoldMinutes: manualEstHoldMinutes, planInterval: analysis.interval,
    });
    resetManualForm();
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Card>
        <SectionLabel>Gõ tên coin để tự động chạy kế hoạch chi tiết</SectionLabel>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <div style={{ position: "relative", flex: "1 1 220px" }}>
            <span style={{ position: "absolute", left: 12, top: 12, color: C.textFaint }}><Icon name="search" size={15} /></span>
            <input value={coinInput} onChange={(e) => setCoinInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && coinInput.trim()) runAnalysis(coinInput, scanInterval); }}
              placeholder="VD: BTC, ETH, SOL..." style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 12px 10px 34px", color: C.text, fontSize: 14 }} />
          </div>
          <select value={scanInterval} onChange={(e) => setScanInterval(e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 10px", color: C.text, fontSize: 13 }}>
            {BINANCE_INTERVALS.map((i) => <option key={i.value} value={i.value}>{i.label} ({i.value})</option>)}
          </select>
          <button className="tt-btn" onClick={() => coinInput.trim() && runAnalysis(coinInput, scanInterval)} style={{ background: `linear-gradient(135deg, ${C.blue}, #7FF5D0)`, boxShadow: "0 0 16px rgba(91,141,239,0.35)", border: "none", borderRadius: 8, padding: "10px 18px", color: "#04101a", fontWeight: 700, fontSize: 14 }}>{analyzing ? "Đang phân tích..." : "Chạy phân tích"}</button>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 12, color: C.textFaint }}>Vốn vào lệnh</span>
            <span style={{ fontSize: 12, color: C.textFaint }}>$</span>
            <input type="number" value={plannedCapital} min="0" step="10" onChange={(e) => setPlannedCapital(+e.target.value)} style={{ width: 90, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px", color: C.text, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginLeft: "auto" }}>
            <span style={{ fontSize: 12, color: C.textFaint }}>Cảnh báo nếu rủi ro &gt;</span>
            <input type="number" value={riskPct} step="0.5" min="0.5" max="5" onChange={(e) => setRiskPct(+e.target.value)} style={{ width: 60, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px", color: C.text, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }} />
            <span style={{ fontSize: 12, color: C.textFaint }}>% vốn</span>
          </div>
        </div>
        {analyzeError && <div style={{ marginTop: 10, fontSize: 13, color: C.bear }}>{analyzeError}</div>}
      </Card>

      {analysis && (
        <Card>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 700 }}>{analysis.symbol.replace("USDT", "")}/USDT</div>
              <Pill tone="blue">Khung {analysis.interval || "4h"}</Pill>
            </div>
            <Pill tone={analysis.direction === "LONG" ? "bull" : analysis.direction.includes("TRÁNH") ? "bear" : analysis.direction.includes("NÓNG") ? "amber" : "neutral"}>{analysis.direction} · độ tin cậy {analysis.confidence}%</Pill>
          </div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 32, marginTop: 10, lineHeight: 1.1 }}>{usd(analysis.price)}</div>

          {analysis.rangePct24h != null && (
            <div style={{ marginTop: 12, fontSize: 12.5, color: C.textDim, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <Icon name="info" size={13} color={C.textFaint} />
              <span>Biên độ 24h thực tế: <b style={{ color: C.text }}>{analysis.rangePct24h.toFixed(1)}%</b></span>
              {analysis.rangePct24h >= rangeMin && analysis.rangePct24h <= rangeMax ? (
                <Pill tone="bull">Nằm trong {rangeMin}-{rangeMax}% đang lọc cho danh sách gợi ý</Pill>
              ) : (
                <Pill tone="amber">Ngoài khoảng {rangeMin}-{rangeMax}% đang lọc — đây là lý do coin này không xuất hiện trong danh sách gợi ý dù tín hiệu có thể tốt</Pill>

            </div>
          )}

          {analysis.direction === "LONG" ? (
            <>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px,1fr))", gap: 12, marginTop: 20 }}>
                <MetricBox label="Vùng vào lệnh" value={usd(analysis.entry)} icon={<Icon name="target" size={14} color={C.blue} />} />
                <MetricBox label="Cắt lỗ (Stop)" value={`${usd(analysis.stop)} (${analysis.pctStop}%)`} icon={<Icon name="shield" size={14} color={C.bear} />} tone="bear" />
                <MetricBox label="Chốt lời (Target)" value={`${usd(analysis.target)} (+${analysis.pctTarget}%)`} icon={<Icon name="up" size={14} color={C.bull} />} tone="bull" />
                <MetricBox label="Tỷ lệ R:R" value={analysis.rr ? `1 : ${analysis.rr}` : "—"} icon={<Icon name="activity" size={14} color={C.amber} />} />
                <MetricBox label="Thời gian giữ lệnh dự kiến" value={formatDuration(analysis.estHoldMinutes)} icon={<Icon name="info" size={14} color={C.textDim} />} />
              </div>

              <div style={{ marginTop: 20, padding: 14, background: C.surface2, borderRadius: 10 }}>
                <SectionLabel>Khối lượng lệnh theo vốn bạn đã nhập ({usd(plannedCapital)})</SectionLabel>
                <div style={{ display: "flex", gap: 24, flexWrap: "wrap", fontFamily: "'JetBrains Mono', monospace", fontSize: 14 }}>
                  <div>Khối lượng: <b>{fmt(qty, 5)} {analysis.symbol.replace("USDT", "")}</b></div>
                  <div>Giá trị lệnh: <b>{usd(positionValue)}</b></div>
                  <div>Rủi ro nếu chạm stop: <b style={{ color: riskExceeds ? C.bear : C.text }}>{usd(riskAmount)} ({riskPctOfCapital.toFixed(2)}% vốn)</b></div>
                </div>
                {plannedCapital > capital && (
                  <div style={{ marginTop: 8, fontSize: 12.5, color: C.amber }}>Vốn bạn nhập (${plannedCapital}) lớn hơn vốn hiện có (${capital.toFixed(0)}) — đã tự giới hạn giá trị lệnh về đúng vốn hiện có.</div>
                )}
                {riskExceeds && (
                  <div style={{ marginTop: 8, fontSize: 12.5, color: C.bear, display: "flex", gap: 6, alignItems: "flex-start" }}>
                    <Icon name="alert" size={13} />
                    <span>Rủi ro thực tế ({riskPctOfCapital.toFixed(2)}%) vượt ngưỡng cảnh báo bạn đặt ({riskPct}%) — cân nhắc giảm "Vốn vào lệnh" xuống còn khoảng {usd(suggestedRisk$ / (Math.abs(analysis.pctStop) / 100))} để giữ đúng mức rủi ro mong muốn.</span>
                  </div>
                )}
                <button className="tt-btn" onClick={() => addTrade({ symbol: analysis.symbol.replace("USDT", ""), direction: "LONG", entry: analysis.entry, stop: analysis.stop, target: analysis.target, qty, openedAt: new Date().toISOString(), source: "system", signalAtEntry: analysis.direction, confidenceAtEntry: analysis.confidence, rsiAtEntry: analysis.curRsi, estHoldMinutes: analysis.estHoldMinutes, planInterval: analysis.interval })}
                  style={{ marginTop: 14, width: "100%", background: `linear-gradient(135deg, ${C.bull}, #5B8DEF)`, boxShadow: "0 0 18px rgba(52,211,153,0.35)", border: "none", borderRadius: 10, padding: "14px 16px", color: "#04101a", fontWeight: 700, fontSize: 14.5, cursor: "pointer" }}>
                  + Ghi nhận lệnh vào Portfolio
                </button>
              </div>
            </>
          ) : analysis.direction.includes("NÓNG") ? (
            <div style={{ marginTop: 20, padding: 14, background: C.amberDim, border: `1px solid ${C.amber}`, borderRadius: 10, fontSize: 13.5, color: C.text, lineHeight: 1.6, display: "flex", gap: 10, alignItems: "flex-start" }}>
              <Icon name="alert" size={16} color={C.amber} />
              <div>

                <div>

                <MetricBox label="Cắt lỗ tham khảo" value={`${usd(analysis.stop)} (${analysis.pctStop}%)`} icon={<Icon name="shield" size={14} color={C.bear} />} tone="bear" />
                <MetricBox label="Chốt lời tham khảo" value={`${usd(analysis.target)} (+${analysis.pctTarget}%)`} icon={<Icon name="up" size={14} color={C.textDim} />} />
                <MetricBox label="Tỷ lệ R:R tham khảo" value={analysis.rr ? `1 : ${analysis.rr}` : "—"} icon={<Icon name="activity" size={14} color={C.amber} />} />

                  <div>Giá trị lệnh: <b>{usd(positionValue)}</b></div>
                  <div>Rủi ro nếu chạm stop: <b style={{ color: riskExceeds ? C.bear : C.text }}>{usd(riskAmount)} ({riskPctOfCapital.toFixed(2)}% vốn)</b></div>
                </div>
                <button className="tt-btn" onClick={() => addTrade({ symbol: analysis.symbol.replace("USDT", ""), direction: "LONG", entry: analysis.entry, stop: analysis.stop, target: analysis.target, qty, openedAt: new Date().toISOString(), source: "manual", signalAtEntry: analysis.direction, confidenceAtEntry: analysis.confidence, rsiAtEntry: analysis.curRsi, estHoldMinutes: analysis.estHoldMinutes, planInterval: analysis.interval })}
                  style={{ marginTop: 12, width: "100%", background: "transparent", border: `1px solid ${C.amber}`, borderRadius: 10, padding: "12px 16px", color: C.amber, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
                  Ghi nhận theo tham khảo này (tự quyết định)
                </button>
              </div>
            </>
          ) : (
            <div style={{ marginTop: 20, padding: 14, background: C.surface2, borderRadius: 10, fontSize: 13.5, color: C.textDim, lineHeight: 1.6, display: "flex", gap: 10, alignItems: "flex-start" }}>
              <Icon name="info" size={16} color={C.textFaint} />
              <div>
                <div style={{ fontWeight: 700, color: C.text, marginBottom: 6, textTransform: "uppercase", fontSize: 12.5, letterSpacing: 0.3 }}>Đây LÀ kết quả phân tích — không phải lỗi hay thiếu dữ liệu</div>
                Tín hiệu hiện tại là <b style={{ color: C.text }}>{analysis.direction}</b> — chưa đủ điều kiện để đề xuất vùng vào lệnh cụ thể (công cụ chỉ giao dịch spot/mua, không đề xuất khi tín hiệu không đủ mạnh theo hướng tăng). Không có gì để làm lúc này — có thể xem coin khác hoặc quay lại kiểm tra sau.
              </div>
            </div>
          )}

          {analysis.direction !== "LONG" && (
            <div style={{ marginTop: 12 }}>
              {!manualOpen ? (
                <button className="tt-btn" onClick={() => { if (analysis.isReferenceOnly && analysis.stop != null) { setManualEntry(String(analysis.entry)); setManualStop(String(analysis.stop)); setManualTarget(String(analysis.target)); } setManualOpen(true); }} style={{ background: "transparent", border: `1px dashed ${C.borderLight}`, borderRadius: 8, padding: "9px 16px", color: C.textDim, fontSize: 13 }}>
                  Tôi muốn tự vào lệnh (ngoài đề xuất của hệ thống) →
                </button>
              ) : (
                <div style={{ background: C.surface2, border: `1px solid ${C.borderLight}`, borderRadius: 10, padding: 14 }}>
                  <SectionLabel>Ghi nhận lệnh thủ công — bạn tự chịu trách nhiệm quyết định này</SectionLabel>
                  <div style={{ fontSize: 12.5, color: C.textFaint, marginBottom: 12 }}>
                    Tín hiệu hệ thống lúc này là <b style={{ color: C.text }}>{analysis.direction}</b> (độ tin cậy {analysis.confidence}%) — hệ thống không đề xuất, nhưng bạn có thể tự đặt kế hoạch. Bắt buộc nhập Stop để tool tính khối lượng lệnh và theo dõi cảnh báo sau này.
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px,1fr))", gap: 10, marginBottom: 10 }}>
                    <div>
                      <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Giá vào lệnh</div>
                      <input type="number" value={manualEntry} onChange={(e) => setManualEntry(e.target.value)} placeholder={fmt(analysis.price)} style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
                    </div>
                    <div>
                      <div style={{ fontSize: 11, color: C.bear, marginBottom: 4 }}>Cắt lỗ (bắt buộc)</div>
                      <input type="number" value={manualStop} onChange={(e) => setManualStop(e.target.value)} placeholder="vd 780" style={{ width: "100%", background: C.surface, border: `1px solid ${mStop > 0 && mStop >= mEntry && mEntry > 0 ? C.bear : C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
                    </div>
                    <div>
                      <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 4 }}>Chốt lời (tùy chọn)</div>
                      <input type="number" value={manualTarget} onChange={(e) => setManualTarget(e.target.value)} placeholder="vd 950" style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "7px 9px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }} />
                    </div>
                  </div>
                  {mStop > 0 && mEntry > 0 && mStop >= mEntry && <div style={{ fontSize: 12, color: C.bear, marginBottom: 8 }}>Stop phải thấp hơn giá vào lệnh (tool chỉ hỗ trợ mua/spot).</div>}
                  {manualValid && (
                    <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, display: "flex", gap: 20, flexWrap: "wrap", marginBottom: 10 }}>
                      <div>Khối lượng: <b>{fmt(manualQtyFinal, 5)}</b></div>
                      <div>Giá trị lệnh: <b>{usd(manualValueFinal)}</b></div>
                      {manualRR && <div>R:R: <b>1 : {manualRR}</b></div>}
                      <div>Rủi ro nếu chạm stop: <b style={{ color: manualRiskExceeds ? C.bear : C.text }}>{usd(manualRiskAmount)} ({manualRiskPctOfCapital.toFixed(2)}% vốn)</b></div>
                    </div>
                  )}
                  {manualRiskExceeds && (
                    <div style={{ marginBottom: 10, fontSize: 12.5, color: C.bear, display: "flex", gap: 6, alignItems: "flex-start" }}>
                      <Icon name="alert" size={13} />
                      <span>Rủi ro thực tế ({manualRiskPctOfCapital.toFixed(2)}%) vượt ngưỡng cảnh báo bạn đặt ({riskPct}%) — đang dùng đúng "Vốn vào lệnh" bạn nhập ở trên, cân nhắc giảm xuống nếu muốn giữ đúng mức rủi ro mong muốn.</span>
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="tt-btn" onClick={submitManualTrade} disabled={!manualValid} style={{ flex: 1, background: manualValid ? C.amber : C.surface, opacity: manualValid ? 1 : 0.4, border: "none", borderRadius: 10, padding: "13px 16px", color: "#1a1400", fontWeight: 700, fontSize: 14, cursor: manualValid ? "pointer" : "not-allowed" }}>+ Ghi nhận lệnh thủ công</button>
                    <button className="tt-btn" onClick={resetManualForm} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, padding: "13px 16px", color: C.textDim, fontSize: 13 }}>Hủy</button>
                  </div>
                </div>
              )}
            </div>
          )}

          <div style={{ marginTop: 16 }}>
            <div onClick={() => setShowMethod(!showMethod)} className="tt-tab" style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: C.textDim }}>
              <Icon name="info" size={14} /> Cơ sở tín hiệu (minh bạch) {showMethod ? <Icon name="chevUp" size={14} /> : <Icon name="chevDown" size={14} />}
            </div>
            {showMethod && (
              <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                {analysis.reasons.map((r, i) => (
                  <div key={i} style={{ display: "flex", gap: 10, fontSize: 13, alignItems: "flex-start" }}>
                    <div style={{ width: 6, height: 6, borderRadius: 3, marginTop: 6, flexShrink: 0, background: r.dir > 0 ? C.bull : r.dir < 0 ? C.bear : C.textFaint }} />
                    <div><b style={{ color: C.text }}>{r.t}:</b> <span style={{ color: C.textDim }}>{r.v}</span></div>
                  </div>
                ))}
                <div style={{ fontSize: 12, color: C.textFaint, marginTop: 4 }}>Điểm tổng: {analysis.score.toFixed(1)} / thang ±7 (điểm lõi động lượng: {analysis.momentumCore.toFixed(1)}) · Ngưỡng (v1.26): điểm tổng ≥3.5 → LONG. Điểm tổng &lt;3.5 nhưng điểm lõi động lượng (Xu hướng+MACD+Volume) ≥2 và RSI/Bollinger quá mua → BREAKOUT NÓNG (không đề xuất entry). Điểm tổng ≤-3.5 → tránh/theo dõi giảm. Còn lại → trung lập thật. Bollinger: sát biên ±2, vừa xuyên đường trung bình ±0.5. Mẫu nến đảo chiều (engulfing/hammer/sao băng): ±0.7 đến ±1, doji chỉ hiển thị không tính điểm. Stop = khoảng cách rủi ro 0.8%-3% giá. Target = ép R:R tối thiểu 1:2.2, ứng viên gần hơn giữa vùng kháng cự và biên trên Bollinger, trần tối đa 7%.</div>
                <div style={{ marginTop: 6, fontSize: 12, color: C.amber, display: "flex", gap: 6, alignItems: "flex-start" }}>
                  <Icon name="alert" size={13} />
                  <span>Công thức v1.25 mới thay đổi trọng số đáng kể — <b>chưa được backtest kiểm chứng</b>. Vào tab Backtest chạy lại trước khi tin tưởng dùng tiền thật.</span>
                </div>
              </div>
            )}
          </div>
        </Card>
      )}

      <DayTradeCard results={dayTradeResults} tier2={dayTradeTier2} scanning={dayTradeScanning} error={dayTradeError} diag={dayTradeDiag} includeBreakout={includeBreakout} setIncludeBreakout={setIncludeBreakout} rangeMin={rangeMin} setRangeMin={setRangeMin} rangeMax={rangeMax} setRangeMax={setRangeMax} minTargetPct={minTargetPct} setMinTargetPct={setMinTargetPct} scanInterval={scanInterval} setScanInterval={setScanInterval} plannedCapital={plannedCapital} setPlannedCapital={setPlannedCapital} scanDayTrade={scanDayTrade} setCoinInput={setCoinInput} setTab={() => {}} runAnalysis={runAnalysis} onOverviewTab={false} />
    </div>
  );
}

function PortfolioTab({ capital, setCapital, trades, closeTrade, deleteTrade, currentEquity, winRate, openRisk, equityCurve, realizedPnl, tickers, exportBackup, importBackup, persistMode, ghToken, ghGistId, ghSyncStatus, ghSyncMessage, ghLastSynced, initGistSync, linkExistingGist, syncNow, disconnectSync, pourTradeToGoal, setTab }) {
  const [showGhSetup, setShowGhSetup] = useState(false);
  const [ghSetupMode, setGhSetupMode] = useState("new"); // 'new' | 'link'
  const [ghTokenInput, setGhTokenInput] = useState("");
  const [ghGistIdInput, setGhGistIdInput] = useState("");
  const [showGistId, setShowGistId] = useState(false);
  const fileInputRef = useRef(null);
  const [editingCapital, setEditingCapital] = useState(false);
  const [capitalInput, setCapitalInput] = useState(capital);
  const [exitInputs, setExitInputs] = useState({});
  const openTrades = trades.filter((t) => t.status === "open");
  const openSummary = openTrades.reduce((acc, t) => {
    const li = getLiveInfo(t);
    acc.totalCapital += t.entry * t.qty;
    if (li.floatingAmount != null) { acc.totalFloating += li.floatingAmount; acc.countPriced += 1; }
    return acc;
  }, { totalCapital: 0, totalFloating: 0, countPriced: 0 });
  openSummary.pct = openSummary.totalCapital > 0 ? (openSummary.totalFloating / openSummary.totalCapital) * 100 : 0;
  const closedTrades = trades.filter((t) => t.status === "closed");

  function getLiveInfo(t) {
    const sym = t.symbol.toUpperCase().trim().endsWith("USDT") ? t.symbol.toUpperCase().trim() : t.symbol.toUpperCase().trim() + "USDT";
    const tk = tickers[sym];
    const curPrice = tk ? +tk.lastPrice : null;
    const floatingPct = curPrice != null ? ((curPrice - t.entry) / t.entry) * 100 : null;
    const floatingAmount = curPrice != null ? (curPrice - t.entry) * t.qty : null;
    const daysHeld = t.openedAt ? (Date.now() - new Date(t.openedAt).getTime()) / 86400000 : null;
    const stopBreached = curPrice != null && curPrice <= t.stop;
    const heldTooLong = daysHeld != null && daysHeld > MAX_HOLD_DAYS;
    const maxLossPct = t.minPriceSeen != null ? ((t.minPriceSeen - t.entry) / t.entry) * 100 : null;
    return { curPrice, floatingPct, floatingAmount, daysHeld, stopBreached, heldTooLong, maxLossPct };
  }

  const needsAttention = openTrades.filter((t) => { const li = getLiveInfo(t); return li.stopBreached || (li.heldTooLong && li.floatingPct < 0); });

  // v1.7: so sánh hiệu quả giữa lệnh hệ thống đề xuất và lệnh tự quyết định (override)
  function groupStats(list) {
    if (!list.length) return null;
    const wins = list.filter((t) => t.pnl > 0).length;
    const pctReturns = list.map((t) => (t.pnl / (t.entry * t.qty)) * 100);
    const avgPct = pctReturns.reduce((a, b) => a + b, 0) / list.length;
    return { count: list.length, winRate: (wins / list.length) * 100, avgPct };
  }
  const closedSystem = closedTrades.filter((t) => (t.source || "system") === "system");
  const closedManual = closedTrades.filter((t) => t.source === "manual");
  const systemStats = groupStats(closedSystem);
  const manualStats = groupStats(closedManual);
  const manualBySignal = {};
  closedManual.forEach((t) => {
    const key = t.signalAtEntry || "Không rõ";
    if (!manualBySignal[key]) manualBySignal[key] = [];
    manualBySignal[key].push(t);
  });

  // v1.22: đánh giá độ chính xác của ước tính thời gian giữ lệnh (ATR-based) so với thực tế đã xảy ra —
  // càng nhiều lệnh đóng, ước tính trung bình này càng đáng tin cậy để tinh chỉnh sau này.
  const holdComparable = closedTrades.filter((t) => t.estHoldMinutes != null && t.actualHoldMinutes != null && t.estHoldMinutes > 0);
  let holdAccuracy = null;
  if (holdComparable.length > 0) {
    const ratios = holdComparable.map((t) => t.actualHoldMinutes / t.estHoldMinutes);
    const avgRatio = ratios.reduce((a, b) => a + b, 0) / ratios.length;
    const overCount = holdComparable.filter((t) => t.actualHoldMinutes > t.estHoldMinutes).length;
    holdAccuracy = { count: holdComparable.length, avgRatio, overCount, underCount: holdComparable.length - overCount };
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Card style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
        <div>
          <SectionLabel>Sao lưu & khôi phục dữ liệu</SectionLabel>
          <div style={{ fontSize: 12.5, color: C.textFaint, lineHeight: 1.5 }}>
            {persistMode === "local" ? "Dữ liệu đang tự lưu trên trình duyệt này. Nên tải file sao lưu định kỳ (vd cuối mỗi tuần) để không mất lịch sử nếu đổi máy/trình duyệt hoặc xóa dữ liệu duyệt web." : "Trình duyệt không lưu được tự động — hãy tải file sao lưu trước khi đóng trang, và khôi phục lại vào lần mở sau."}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="tt-btn" onClick={exportBackup} style={{ background: C.blue, border: "none", borderRadius: 8, padding: "9px 14px", color: "#04101a", fontWeight: 600, fontSize: 13 }}>Tải file sao lưu</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ""; }} />
          <button className="tt-btn" onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 14px", color: C.text, fontWeight: 600, fontSize: 13 }}>Khôi phục từ file</button>
        </div>
      </Card>

      <Card>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
          <SectionLabel>Đồng bộ nhiều thiết bị (GitHub Gist)</SectionLabel>
          {ghToken && ghGistId && (
            <Pill tone={ghSyncStatus === "error" ? "bear" : ghSyncStatus === "syncing" ? "amber" : "bull"}>
              {ghSyncStatus === "syncing" ? "Đang đồng bộ..." : ghSyncStatus === "error" ? "Lỗi đồng bộ" : `Đã đồng bộ${ghLastSynced ? " · " + new Date(ghLastSynced).toLocaleTimeString("vi-VN") : ""}`}
            </Pill>
          )}
        </div>

        {!ghToken || !ghGistId ? (
          <>
            <div style={{ fontSize: 12.5, color: C.textFaint, marginBottom: 12, lineHeight: 1.6 }}>
              Dùng chính tài khoản GitHub bạn đã có để tự động đồng bộ vốn/lệnh/mục tiêu giữa nhiều thiết bị (máy tính + điện thoại), thay vì mỗi máy giữ 1 bản riêng. Dữ liệu lưu ở 1 <b>Gist bí mật</b> (không công khai) — không phải trong repo GitHub Pages.
            </div>
            {!showGhSetup ? (
              <button className="tt-btn" onClick={() => setShowGhSetup(true)} style={{ background: "transparent", border: `1px dashed ${C.borderLight}`, borderRadius: 6, color: C.textDim, fontSize: 12, padding: "6px 14px" }}>+ Thiết lập đồng bộ</button>
            ) : (
              <div>
                <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                  <button className="tt-btn" onClick={() => setGhSetupMode("new")} style={{ background: ghSetupMode === "new" ? C.blue : C.surface2, color: ghSetupMode === "new" ? "#04101a" : C.textDim, border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 12, fontWeight: 600 }}>Thiết bị đầu tiên (tạo mới)</button>
                  <button className="tt-btn" onClick={() => setGhSetupMode("link")} style={{ background: ghSetupMode === "link" ? C.blue : C.surface2, color: ghSetupMode === "link" ? "#04101a" : C.textDim, border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 12, fontWeight: 600 }}>Thiết bị thứ 2+ (liên kết)</button>
                </div>
                <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 10, lineHeight: 1.6 }}>
                  1. Vào <b>github.com/settings/tokens</b> → Generate new token (classic) → chỉ tick quyền <b>gist</b> → Generate → copy token (chỉ hiện 1 lần).<br />
                  {ghSetupMode === "new" ? "2. Dán token vào đây, bấm Tạo — dùng lại đúng token này ở các thiết bị khác." : "2. Dán token VÀ Gist ID lấy từ thiết bị đầu tiên (xem ở mục bên dưới sau khi thiết lập) vào đây."}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <input type="password" value={ghTokenInput} onChange={(e) => setGhTokenInput(e.target.value)} placeholder="Dán GitHub token (ghp_...)" style={{ flex: 1, minWidth: 220, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5 }} />
                  {ghSetupMode === "link" && (
                    <input value={ghGistIdInput} onChange={(e) => setGhGistIdInput(e.target.value)} placeholder="Gist ID" style={{ width: 160, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 10px", color: C.text, fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5 }} />
                  )}
                  <button className="tt-btn" disabled={!ghTokenInput || (ghSetupMode === "link" && !ghGistIdInput)}
                    onClick={() => { if (ghSetupMode === "new") initGistSync(ghTokenInput); else linkExistingGist(ghTokenInput, ghGistIdInput); setShowGhSetup(false); setGhTokenInput(""); setGhGistIdInput(""); }}
                    style={{ background: C.blue, opacity: (!ghTokenInput || (ghSetupMode === "link" && !ghGistIdInput)) ? 0.4 : 1, border: "none", borderRadius: 6, padding: "8px 16px", color: "#04101a", fontWeight: 700, fontSize: 13 }}>
                    {ghSetupMode === "new" ? "Tạo đồng bộ" : "Kết nối"}
                  </button>
                  <button className="tt-btn" onClick={() => setShowGhSetup(false)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px", color: C.textDim, fontSize: 12.5 }}>Hủy</button>
                </div>
                <div style={{ marginTop: 8, fontSize: 11.5, color: C.amber }}>Lưu ý bảo mật: token này cho phép đọc/ghi Gist của bạn — chỉ dán vào thiết bị bạn tin tưởng, không chia sẻ, không dán vào file sao lưu.</div>
              </div>
            )}
          </>
        ) : (
          <div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
              <button className="tt-btn" onClick={syncNow} disabled={ghSyncStatus === "syncing"} style={{ background: C.blue, opacity: ghSyncStatus === "syncing" ? 0.5 : 1, border: "none", borderRadius: 6, padding: "8px 16px", color: "#04101a", fontWeight: 700, fontSize: 13 }}>Đồng bộ ngay</button>
              <button className="tt-btn" onClick={() => setShowGistId(!showGistId)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px", color: C.textDim, fontSize: 12.5 }}>{showGistId ? "Ẩn" : "Xem"} Gist ID (để nối thiết bị khác)</button>
              <button className="tt-btn" onClick={disconnectSync} style={{ background: "transparent", border: `1px solid ${C.bear}`, borderRadius: 6, padding: "8px 12px", color: C.bear, fontSize: 12.5 }}>Ngắt đồng bộ</button>
            </div>
            {showGistId && <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, background: C.surface2, padding: "8px 10px", borderRadius: 6, color: C.text, marginBottom: 8, wordBreak: "break-all" }}>Gist ID: {ghGistId}</div>}
            {ghSyncMessage && <div style={{ fontSize: 12.5, color: C.bear }}>{ghSyncMessage}</div>}
          </div>
        )}
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 14 }}>
        <Card><SectionLabel>Vốn ban đầu</SectionLabel>
          {editingCapital ? (
            <div style={{ display: "flex", gap: 6 }}>
              <input autoFocus type="number" value={capitalInput} onChange={(e) => setCapitalInput(+e.target.value)} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 8px", color: C.text, width: 100, fontFamily: "'JetBrains Mono', monospace" }} />

            </div>
          ) : <div onDoubleClick={() => { setCapitalInput(capital); setEditingCapital(true); }} title="Nhấp đúp để sửa" className="tt-tab" style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, cursor: "pointer" }}>{usd(capital)}</div>}
        </Card>
        <Card><SectionLabel>Vốn hiện tại</SectionLabel><div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: currentEquity >= capital ? C.bull : C.bear }}>{usd(currentEquity)}</div></Card>
        <Card><SectionLabel>Lãi/lỗ đã thực hiện</SectionLabel><div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: realizedPnl >= 0 ? C.bull : C.bear }}>{realizedPnl >= 0 ? "+" : ""}{usd(realizedPnl)}</div></Card>
        <Card><SectionLabel>Tỷ lệ thắng</SectionLabel><div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700 }}>{winRate != null ? winRate + "%" : "—"}</div><div style={{ fontSize: 11, color: C.textFaint, marginTop: 2 }}>{closedTrades.length} lệnh đã đóng</div></Card>
      </div>

      {openRisk > 0 && <div style={{ background: C.amberDim, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 16px", fontSize: 13, color: C.amber, display: "flex", gap: 8, alignItems: "center" }}><Icon name="shield" size={15} /> Tổng rủi ro đang mở: {usd(openRisk)} ({((openRisk / currentEquity) * 100).toFixed(1)}% vốn hiện tại)</div>}

      {needsAttention.length > 0 && (
        <div style={{ background: C.bearDim, border: `1px solid ${C.bear}`, borderRadius: 10, padding: "12px 16px", fontSize: 13, color: C.bear, display: "flex", gap: 8, alignItems: "flex-start" }}>
          <Icon name="alert" size={16} />
          <div><b>{needsAttention.length} lệnh cần chú ý ngay</b> — đã chạm/vượt stop hoặc giữ quá {MAX_HOLD_DAYS} ngày trong khi đang lỗ. Xem chi tiết ở bảng "Lệnh đang mở" bên dưới. Đây là lời nhắc dựa trên kế hoạch bạn đã đặt ra khi vào lệnh — không phải lời khuyên đầu tư, quyết định cuối cùng vẫn là của bạn.</div>
        </div>
      )}

      <Card><SectionLabel>Đường cong vốn (equity curve)</SectionLabel>
        {equityCurve.length > 1 ? <EquityChart data={equityCurve} capital={capital} /> : <div style={{ color: C.textFaint, fontSize: 13 }}>Chưa có lệnh đóng để vẽ đường cong vốn. Ghi nhận lệnh ở tab "Kế hoạch hành động".</div>}
      </Card>

      <Card><SectionLabel>Lệnh đang mở ({openTrades.length})</SectionLabel>
        {openTrades.length === 0 && <div style={{ color: C.textFaint, fontSize: 13 }}>Không có lệnh nào đang mở.</div>}
        {openTrades.length > 0 && (
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", marginBottom: 14, padding: "12px 14px", background: C.surface2, borderRadius: 10, fontFamily: "'JetBrains Mono', monospace", fontSize: 13.5 }}>
            <div><span style={{ color: C.textFaint, fontFamily: "'Inter', sans-serif" }}>Tổng vốn đang mở: </span><b>{usd(openSummary.totalCapital)}</b></div>
            <div><span style={{ color: C.textFaint, fontFamily: "'Inter', sans-serif" }}>Tổng lãi/lỗ tạm tính: </span><b style={{ color: openSummary.totalFloating >= 0 ? C.bull : C.bear }}>{openSummary.totalFloating >= 0 ? "+" : ""}{usd(openSummary.totalFloating)}</b></div>
            <div><span style={{ color: C.textFaint, fontFamily: "'Inter', sans-serif" }}>% trên tổng vốn đang mở: </span><b style={{ color: openSummary.pct >= 0 ? C.bull : C.bear }}>{openSummary.pct >= 0 ? "+" : ""}{openSummary.pct.toFixed(2)}%</b></div>
          </div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {openTrades.map((t) => {

                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
